<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dog Jump</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:linear-gradient(
        #70c9ff,
        #dff6ff 75%,
        #ffffff
    );
}


/* الشمس */

#sun{
    position:absolute;

    top:35px;
    right:35px;

    width:70px;
    height:70px;

    background:#ffd83d;

    border-radius:50%;
}


/* SCORE */

#score{
    position:absolute;

    top:20px;
    left:20px;

    font-size:25px;
    font-weight:bold;

    color:#111;

    z-index:50;
}


/* DOG */

#dog{
    position:absolute;

    left:80px;
    bottom:95px;

    width:65px;
    height:65px;

    font-size:56px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:20;
}


/* GROUND */

#ground{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:95px;

    background:#4caf50;

    border-top:7px solid #286e2c;
}


/* WALL */

.wall{
    position:absolute;

    right:-80px;
    bottom:95px;

    width:58px;

    /* نقصنا العلو */

    height:65px;

    background:
    repeating-linear-gradient(
        90deg,
        #754018 0px,
        #754018 12px,
        #995321 12px,
        #995321 24px
    );

    border:5px solid #54280c;

    border-radius:4px;

    z-index:10;
}


/* JUMP BUTTON */

#jump{

    position:absolute;

    right:25px;

    /* طلعناه شوية */

    bottom:120px;

    width:145px;
    height:68px;

    border:none;

    border-radius:35px;

    background:#e53935;

    color:white;

    font-size:22px;

    font-weight:bold;

    z-index:100;

    box-shadow:
        0 6px 0 #a71916;
}

#jump:active{

    transform:translateY(5px);

    box-shadow:
        0 1px 0 #a71916;
}


/* GAME OVER */

#gameOver{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:rgba(0,0,0,.72);

    color:white;

    z-index:200;
}

#gameOver h1{

    font-size:44px;

    margin-bottom:12px;
}

#finalScore{

    font-size:23px;
}

#restart{

    margin-top:22px;

    padding:14px 35px;

    border:none;

    border-radius:30px;

    background:#2196f3;

    color:white;

    font-size:20px;

    font-weight:bold;
}

</style>
</head>


<body>

<div id="game">

    <div id="sun"></div>

    <div id="score">
        Score: 0
    </div>

    <div id="dog">
        🐕
    </div>

    <div id="ground"></div>

    <button id="jump">
        JUMP 🦘
    </button>

    <div id="gameOver">

        <h1>
            GAME OVER 💥
        </h1>

        <div id="finalScore">
            Score: 0
        </div>

        <button id="restart">
            RESTART 🔄
        </button>

    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const dog =
    document.getElementById("dog");

const game =
    document.getElementById("game");

const jumpButton =
    document.getElementById("jump");

const scoreText =
    document.getElementById("score");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const restart =
    document.getElementById("restart");


/* =========================
   GAME VARIABLES
========================= */

let playing = true;

let dogY = 0;

let velocity = 0;

let jumping = false;


/* =========================
   PHYSICS
========================= */

/* القفزة الجديدة */

const jumpPower = 13;

const gravity = 0.75;


/* سرعة اللعبة */

let speed = 5;


/* Score */

let score = 0;


/* الأسوار */

let walls = [];


/* Timer */

let spawnTimer = 0;


/*
   مسافة أكبر شوية
   بين الأسوار
*/

let nextWall =
    randomBetween(135,195);


/* =========================
   RANDOM
========================= */

function randomBetween(min,max){

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;
}


/* =========================
   JUMP
========================= */

function jump(){

    if(!playing)
        return;

    if(jumping)
        return;

    jumping = true;

    velocity = jumpPower;
}


/* الهاتف */

jumpButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        jump();

    },
    {passive:false}
);


/* الضغط العادي */

jumpButton.addEventListener(
    "click",
    jump
);


/* الكمبيوتر */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();
        }

    }
);


/* =========================
   CREATE WALL
========================= */

function createWall(){

    const wall =
        document.createElement("div");

    wall.className =
        "wall";

    wall.style.right =
        "-80px";

    game.appendChild(wall);

    walls.push({

        element:wall,

        passed:false

    });
}


/* =========================
   COLLISION
========================= */

function checkCollision(){

    const dogBox =
        dog.getBoundingClientRect();


    /*
       Hitbox أصغر من الكلب
    */

    const dogLeft =
        dogBox.left + 18;

    const dogRight =
        dogBox.right - 18;

    const dogTop =
        dogBox.top + 12;

    const dogBottom =
        dogBox.bottom - 7;


    for(const wall of walls){

        const wallBox =
            wall.element.getBoundingClientRect();


        /*
           السور بعيد
           ما نديروش collision
        */

        if(
            wallBox.left >
            dogRight + 5
        ){

            continue;
        }


        /*
           السور داز
        */

        if(
            wallBox.right <
            dogLeft
        ){

            continue;
        }


        /*
           الاصطدام الحقيقي
        */

        const horizontal =
            dogRight >
            wallBox.left &&
            dogLeft <
            wallBox.right;


        const vertical =
            dogBottom >
            wallBox.top &&
            dogTop <
            wallBox.bottom;


        if(
            horizontal &&
            vertical
        ){

            return true;
        }

    }

    return false;
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    playing = false;

    finalScore.textContent =
        "Score: " +
        Math.floor(score);

    gameOverScreen.style.display =
        "flex";
}


/* =========================
   GAME LOOP
========================= */

function update(){

    if(!playing)
        return;


    /* =====================
       DOG PHYSICS
    ===================== */

    if(jumping){

        dogY += velocity;

        velocity -= gravity;


        /*
           يرجع للأرض
        */

        if(dogY <= 0){

            dogY = 0;

            velocity = 0;

            jumping = false;
        }
    }


    dog.style.bottom =
        (95 + dogY) + "px";


    /* =====================
       SPAWN WALL
    ===================== */

    spawnTimer++;


    if(
        spawnTimer >=
        nextWall
    ){

        createWall();

        spawnTimer = 0;


        /*
           مسافة عشوائية
        */

        nextWall =
            randomBetween(
                135,
                195
            );
    }


    /* =====================
       MOVE WALLS
    ===================== */

    for(
        let i = walls.length - 1;
        i >= 0;
        i--
    ){

        const wall =
            walls[i];

        const element =
            wall.element;


        let right =
            parseFloat(
                getComputedStyle(
                    element
                ).right
            );


        right += speed;


        element.style.right =
            right + "px";


        /* Collision */

        if(checkCollision()){

            endGame();

            return;
        }


        /* =================
           SCORE
        ================= */

        const wallBox =
            element.getBoundingClientRect();

        const dogBox =
            dog.getBoundingClientRect();


        if(
            !wall.passed &&
            wallBox.right <
            dogBox.left
        ){

            wall.passed = true;

            score += 10;
        }


        /* حذف السور */

        if(
            right >
            window.innerWidth + 100
        ){

            element.remove();

            walls.splice(i,1);
        }
    }


    /* Score مع الوقت */

    score += 0.02;


    scoreText.textContent =
        "Score: " +
        Math.floor(score);


    /* زيادة الصعوبة ببطء */

    speed += 0.0002;


    requestAnimationFrame(update);
}


/* =========================
   RESTART
========================= */

restart.addEventListener(
    "click",
    function(){

        location.reload();

    }
);


/* =========================
   START
========================= */

update();

</script>

</body>
    </html>
