<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Jump Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#8ed8ff;
    touch-action:none;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:linear-gradient(
        #70c9ff 0%,
        #c8efff 70%,
        #e9f9ff 100%
    );
}

/* الشمس */
#sun{
    position:absolute;
    width:75px;
    height:75px;
    background:#ffd83d;
    border-radius:50%;
    top:35px;
    right:40px;
}

/* Score */
#score{
    position:absolute;
    top:20px;
    left:20px;
    z-index:50;
    font-size:25px;
    font-weight:bold;
    color:#111;
}

/* الأرض */
#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:95px;
    background:#4caf50;
    border-top:7px solid #28752d;
}

/* الكلب */
#dog{
    position:absolute;
    left:75px;
    bottom:95px;
    width:70px;
    height:70px;
    font-size:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

/* السور */
.wall{
    position:absolute;
    right:-80px;
    bottom:95px;
    width:58px;
    height:78px;
    background:
        repeating-linear-gradient(
            90deg,
            #7b3f18 0px,
            #7b3f18 12px,
            #9a5423 12px,
            #9a5423 24px
        );
    border:5px solid #54270c;
    border-radius:4px;
    z-index:10;
}

/* زر القفز */
#jump{
    position:absolute;
    right:25px;
    bottom:120px;
    width:145px;
    height:68px;
    border:none;
    border-radius:35px;
    background:#e53935;
    color:white;
    font-size:22px;
    font-weight:bold;
    z-index:100;
    box-shadow:0 6px 0 #a51d1a;
}

#jump:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #a51d1a;
}

/* Game Over */
#over{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.72);
    color:white;
    z-index:200;
}

#over h1{
    font-size:44px;
    margin-bottom:10px;
}

#over p{
    font-size:23px;
}

#restart{
    margin-top:22px;
    padding:14px 35px;
    border:0;
    border-radius:30px;
    background:#2196f3;
    color:white;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="sun"></div>

    <div id="score">
        Score: 0
    </div>

    <div id="dog">
        🐕
    </div>

    <div id="ground"></div>

    <button id="jump">
        JUMP 🦘
    </button>

    <div id="over">
        <h1>GAME OVER 💥</h1>
        <p id="final">Score: 0</p>
        <button id="restart">
            RESTART 🔄
        </button>
    </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

const dog = document.getElementById("dog");
const game = document.getElementById("game");
const jumpButton = document.getElementById("jump");
const scoreElement = document.getElementById("score");
const gameOver = document.getElementById("over");
const finalScore = document.getElementById("final");
const restart = document.getElementById("restart");


let playing = true;

let dogHeight = 0;

let velocity = 0;

let jumping = false;


/*
   قفزة أقصر وواقعية
*/
const jumpPower = 11;
const gravity = 0.72;


/* السرعة */
let speed = 5;


/* النقاط */
let score = 0;


/* الأسوار */
let walls = [];


/* وقت ظهور السور */
let spawnTime = 0;


/* =========================
   JUMP
========================= */

function jump(){

    if(!playing) return;

    /*
       ما نسمحوش بالقفز
       وسط قفزة أخرى
    */

    if(jumping) return;

    jumping = true;

    velocity = jumpPower;
}


/* زر الهاتف */

jumpButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        jump();

    },
    {passive:false}
);


/* الضغط العادي */

jumpButton.addEventListener(
    "click",
    function(){

        jump();

    }
);


/* Keyboard */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();

        }

    }
);


/* =========================
   CREATE WALL
========================= */

function createWall(){

    const wall =
        document.createElement("div");

    wall.className = "wall";

    wall.style.right = "-80px";

    game.appendChild(wall);

    walls.push({
        element:wall,
        passed:false
    });
}


/* =========================
   COLLISION
========================= */

function isColliding(){

    const dogBox =
        dog.getBoundingClientRect();


    /*
       كنصغرو منطقة الاصطدام
       شوية باش اللعبة تكون عادلة
    */

    const dogLeft =
        dogBox.left + 12;

    const dogRight =
        dogBox.right - 12;

    const dogTop =
        dogBox.top + 12;

    const dogBottom =
        dogBox.bottom - 5;


    for(const wall of walls){

        const box =
            wall.element.getBoundingClientRect();


        /*
           غير ملي السور يكون قريب
        */

        const horizontal =
            dogRight > box.left &&
            dogLeft < box.right;


        const vertical =
            dogBottom > box.top &&
            dogTop < box.bottom;


        if(horizontal && vertical){

            return true;

        }

    }

    return false;
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    playing = false;

    finalScore.textContent =
        "Score: " + Math.floor(score);

    gameOver.style.display =
        "flex";
}


/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop(){

    if(!playing) return;


    /* =================
       DOG PHYSICS
    ================= */

    if(jumping){

        dogHeight += velocity;

        velocity -= gravity;


        /*
           رجوع للأرض
        */

        if(dogHeight <= 0){

            dogHeight = 0;

            velocity = 0;

            jumping = false;
        }
    }


    dog.style.bottom =
        (95 + dogHeight) + "px";


    /* =================
       CREATE WALLS
    ================= */

    spawnTime++;


    /*
       المسافة بين الأسوار
       ماشي قريبة بزاف
    */

    if(spawnTime >= 135){

        createWall();

        spawnTime = 0;
    }


    /* =================
       MOVE WALLS
    ================= */

    for(
        let i = walls.length - 1;
        i >= 0;
        i--
    ){

        const wall = walls[i];

        const element =
            wall.element;


        let right =
            parseFloat(
                getComputedStyle(element).right
            );


        right += speed;

        element.style.right =
            right + "px";


        /* Collision */

        if(isColliding()){

            endGame();

            return;
        }


        /* Score */

        const wallBox =
            element.getBoundingClientRect();

        const dogBox =
            dog.getBoundingClientRect();


        if(
            !wall.passed &&
            wallBox.right < dogBox.left
        ){

            wall.passed = true;

            score += 10;
        }


        /* حذف السور القديم */

        if(
            right >
            window.innerWidth + 100
        ){

            element.remove();

            walls.splice(i,1);
        }
    }


    /* نقاط الوقت */

    score += 0.02;

    scoreElement.textContent =
        "Score: " +
        Math.floor(score);


    /* زيادة الصعوبة تدريجيا */

    speed += 0.00025;


    requestAnimationFrame(gameLoop);
}


/* =========================
   RESTART
========================= */

restart.addEventListener(
    "click",
    function(){

        location.reload();

    }
);


/* =========================
   START GAME
========================= */

gameLoop();

</script>

</body>
    </html>
