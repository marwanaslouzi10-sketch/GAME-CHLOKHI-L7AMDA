<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* ===== MAPS ===== */

#game.stage1{
    background:linear-gradient(
        to bottom,
        #58c5ff 0%,
        #c4efff 58%,
        #70c653 58%,
        #36952f 100%
    );
}

#game.stage2{
    background:linear-gradient(
        to bottom,
        #899196 0%,
        #c5c9cb 55%,
        #606568 55%,
        #303336 100%
    );
}

#game.stage3{
    background:linear-gradient(
        to bottom,
        #20aef5 0%,
        #8edfff 65%,
        #e2f8ff 100%
    );
}

#game.stage4{
    background:linear-gradient(
        to bottom,
        #ffac50 0%,
        #e45a31 50%,
        #6e211b 75%,
        #250909 100%
    );
}

#game.stage5{
    background:linear-gradient(
        to bottom,
        #12182b 0%,
        #202b48 55%,
        #080b12 100%
    );
}

#game.stage6{
    background:linear-gradient(
        to bottom,
        #080a18 0%,
        #171b35 55%,
        #04050a 100%
    );
}

/* ===== GROUND ===== */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:18%;
    background:#389b32;
    z-index:5;
}

#game.stage2 #ground{
    background:#34383b;
}

#game.stage3 #ground{
    background:rgba(255,255,255,.3);
}

#game.stage4 #ground{
    background:#301010;
}

#game.stage5 #ground,
#game.stage6 #ground{
    background:#08090e;
}

/* ===== UI ===== */

#score{
    position:absolute;
    top:15px;
    left:15px;
    z-index:100;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#stageText{
    position:absolute;
    top:48px;
    left:15px;
    z-index:100;
    color:white;
    font-size:19px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#message{
    position:absolute;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:200;
    color:white;
    font-size:44px;
    font-weight:bold;
    text-align:center;
    text-shadow:3px 3px 7px black;
}

#playButton{
    position:absolute;
    top:58%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:201;
    padding:20px 60px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 5px 0 #15803d;
}

#playButton:active{
    transform:translate(-50%,-46%);
}

/* ===== PLAYER ===== */

#player{
    position:absolute;
    left:11%;
    bottom:18%;
    width:70px;
    height:70px;
    z-index:20;
    font-size:52px;
    line-height:70px;
    text-align:center;
    transform:translateY(0);
}

#player.duck{
    transform:
        translateY(24px)
        scaleY(.60);
}

/* ===== BUTTONS ===== */

.control{
    position:absolute;
    bottom:25px;
    z-index:150;
    width:125px;
    height:65px;
    border:none;
    border-radius:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 5px 0 rgba(0,0,0,.35);
    touch-action:none;
}

.control:active{
    transform:translateY(4px);
}

#jumpButton{
    right:25px;
    background:#2563eb;
}

#shootButton{
    right:25px;
    background:#dc2626;
    display:none;
}

#duckButton{
    right:25px;
    background:#9333ea;
    display:none;
}

/* ===== WOOD ===== */

.obstacle{
    position:absolute;
    width:42px;
    height:65px;
    bottom:18%;
    background:#8b4513;
    border:4px solid #5b2c0c;
    border-radius:4px;
    z-index:10;
}

.obstacle::before{
    content:"";
    position:absolute;
    left:4px;
    top:12px;
    width:26px;
    height:5px;
    background:#c27a3c;
    transform:rotate(-10deg);
}

.obstacle::after{
    content:"";
    position:absolute;
    left:5px;
    top:35px;
    width:25px;
    height:5px;
    background:#c27a3c;
    transform:rotate(8deg);
}

.hpText{
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 3px black;
}

/* ===== BULLET ===== */

.bullet{
    position:absolute;
    width:16px;
    height:6px;
    background:#ffd000;
    border-radius:5px;
    z-index:30;
}

/* ===== BIRD ===== */

.bird{
    position:absolute;
    width:55px;
    height:45px;
    font-size:42px;
    z-index:15;
}

</style>
</head>

<body>

<div id="game" class="stage1">

    <div id="score">SCORE: 0</div>

    <div id="stageText">
        STAGE 1 - DAY
    </div>

    <div id="message">
        DOG RUNNER
    </div>

    <button id="playButton">
        PLAY
    </button>

    <div id="player">🐕</div>

    <div id="ground"></div>

    <button id="jumpButton" class="control">
        JUMP
    </button>

    <button id="shootButton" class="control">
        SHOOT
    </button>

    <button id="duckButton" class="control">
        DUCK
    </button>

</div>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const stageText = document.getElementById("stageText");

const message = document.getElementById("message");
const playButton = document.getElementById("playButton");

const jumpButton = document.getElementById("jumpButton");
const shootButton = document.getElementById("shootButton");
const duckButton = document.getElementById("duckButton");


/* =====================================================
   VARIABLES
===================================================== */

let gameStarted = false;
let gameOver = false;

let score = 0;
let stage = 1;

let playerY = 0;
let velocityY = 0;

const gravity = 0.75;
const jumpPower = 13;

let jumping = false;
let ducking = false;

let obstacles = [];
let bullets = [];
let birds = [];

let obstacleTimer = 0;
let birdTimer = 0;

let lastTime = 0;


/* =====================================================
   PLAY
===================================================== */

function startGame(){

    if(gameStarted) return;

    gameStarted = true;
    gameOver = false;

    score = 0;
    stage = 1;

    playerY = 0;
    velocityY = 0;

    jumping = false;
    ducking = false;

    obstacleTimer = 0;
    birdTimer = 0;

    clearObjects();

    message.style.display = "none";
    playButton.style.display = "none";

    player.textContent = "🐕";
    player.classList.remove("duck");

    updateStage();

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}

playButton.addEventListener("click",startGame);

playButton.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    startGame();
},{passive:false});


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(!gameStarted || gameOver) return;

    if(stage === 3) return;

    if(jumping) return;

    jumping = true;
    velocityY = jumpPower;
}

jumpButton.addEventListener("click",jump);

jumpButton.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    jump();
},{passive:false});


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener("keydown",(e)=>{

    if(
        e.code === "Space" ||
        e.code === "ArrowUp"
    ){
        e.preventDefault();
        jump();
    }

    if(
        e.code === "ArrowDown" &&
        stage === 3
    ){
        startDuck(e);
    }

    if(e.code === "KeyX"){
        shoot();
    }
});

document.addEventListener("keyup",(e)=>{

    if(e.code === "ArrowDown"){
        stopDuck(e);
    }
});


/* =====================================================
   DUCK
   FIXED FOR PHONE
===================================================== */

function startDuck(e){

    if(e) e.preventDefault();

    if(stage !== 3 || gameOver) return;

    ducking = true;

    player.classList.add("duck");
}

function stopDuck(e){

    if(e) e.preventDefault();

    ducking = false;

    player.classList.remove("duck");
}


/* Touch */

duckButton.addEventListener(
    "touchstart",
    startDuck,
    {passive:false}
);

duckButton.addEventListener(
    "touchend",
    stopDuck,
    {passive:false}
);

duckButton.addEventListener(
    "touchcancel",
    stopDuck,
    {passive:false}
);


/* Mouse */

duckButton.addEventListener(
    "mousedown",
    startDuck
);

duckButton.addEventListener(
    "mouseup",
    stopDuck
);

duckButton.addEventListener(
    "mouseleave",
    stopDuck
);


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        !gameStarted ||
        gameOver ||
        stage !== 2
    ) return;

    const rect =
        player.getBoundingClientRect();

    const gameRect =
        game.getBoundingClientRect();

    const bullet =
        document.createElement("div");

    bullet.className = "bullet";

    bullet.x =
        rect.right -
        gameRect.left;

    bullet.y =
        rect.top -
        gameRect.top +
        30;

    bullet.style.left =
        bullet.x + "px";

    bullet.style.top =
        bullet.y + "px";

    game.appendChild(bullet);

    bullets.push(bullet);
}

shootButton.addEventListener("click",shoot);

shootButton.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    shoot();
},{passive:false});


/* =====================================================
   CREATE OBSTACLE
===================================================== */

function createObstacle(){

    const obstacle =
        document.createElement("div");

    obstacle.className = "obstacle";

    obstacle.x =
        window.innerWidth + 30;

    obstacle.hp = 3;

    obstacle.style.left =
        obstacle.x + "px";

    if(stage === 2){

        const hp =
            document.createElement("div");

        hp.className = "hpText";
        hp.textContent = "3";

        obstacle.appendChild(hp);

        obstacle.hpText = hp;
    }

    game.appendChild(obstacle);

    obstacles.push(obstacle);
}


/* =====================================================
   CREATE BIRD
===================================================== */

function createBird(){

    const bird =
        document.createElement("div");

    bird.className = "bird";

    bird.textContent = "🦅";

    bird.x =
        window.innerWidth + 60;

    /*
       BIRD RAISED HIGHER
       So it flies clearly above the dog.
    */

    bird.y =
        game.clientHeight * 0.82 - 105;

    bird.y +=
        Math.random() * 15 - 7;

    bird.style.left =
        bird.x + "px";

    bird.style.top =
        bird.y + "px";

    game.appendChild(bird);

    birds.push(bird);
}


/* =====================================================
   CLEAR OBJECTS
===================================================== */

function clearObjects(){

    obstacles.forEach(o=>o.remove());
    bullets.forEach(b=>b.remove());
    birds.forEach(b=>b.remove());

    obstacles = [];
    bullets = [];
    birds = [];
}


/* =====================================================
   STAGE
===================================================== */

function updateStage(){

    updateMap();
    updateControls();

    if(stage === 1){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 1 - DAY";
    }

    else if(stage === 2){

        player.textContent = "🪖🐕";

        stageText.textContent =
            "STAGE 2 - MILITARY DAY";
    }

    else if(stage === 3){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 3 - SKY DAY";
    }

    else if(stage === 4){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 4 - VOLCANO";
    }

    else if(stage === 5){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 5 - NIGHT";
    }

    else{

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE " +
            stage +
            " - DARK ZONE";
    }
}


/* =====================================================
   MAP
===================================================== */

function updateMap(){

    game.className = "";

    if(stage === 1){
        game.classList.add("stage1");
    }

    else if(stage === 2){
        game.classList.add("stage2");
    }

    else if(stage === 3){
        game.classList.add("stage3");
    }

    else if(stage === 4){
        game.classList.add("stage4");
    }

    else if(stage === 5){
        game.classList.add("stage5");
    }

    else{
        game.classList.add("stage6");
    }
}


/* =====================================================
   CONTROLS
===================================================== */

function updateControls(){

    jumpButton.style.display =
        stage === 1 ||
        stage >= 4
        ? "block"
        : "none";

    shootButton.style.display =
        stage === 2
        ? "block"
        : "none";

    duckButton.style.display =
        stage === 3
        ? "block"
        : "none";
}


/* =====================================================
   PLAYER HITBOX
===================================================== */

function getPlayerBox(){

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        player.getBoundingClientRect();


    /*
       STAGE 3:
       Only the head is dangerous.
    */

    if(stage === 3){

        if(ducking){

            return {

                left:
                    rect.left -
                    gameRect.left + 25,

                right:
                    rect.right -
                    gameRect.left - 25,

                top:
                    rect.top -
                    gameRect.top + 36,

                bottom:
                    rect.top -
                    gameRect.top + 58
            };
        }

        return {

            left:
                rect.left -
                gameRect.left + 18,

            right:
                rect.right -
                gameRect.left - 18,

            top:
                rect.top -
                gameRect.top + 10,

            bottom:
                rect.top -
                gameRect.top + 38
        };
    }


    /*
       Normal stages:
       only feet collide.
    */

    return {

        left:
            rect.left -
            gameRect.left + 22,

        right:
            rect.right -
            gameRect.left - 22,

        top:
            rect.bottom -
            gameRect.top - 28,

        bottom:
            rect.bottom -
            gameRect.top - 3
    };
}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

    return(
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}


/* =====================================================
   OBSTACLE HITBOX
===================================================== */

function getObstacleBox(o){

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        o.getBoundingClientRect();

    return {

        left:
            rect.left -
            gameRect.left + 5,

        right:
            rect.right -
            gameRect.left - 5,

        top:
            rect.top -
            gameRect.top + 3,

        bottom:
            rect.bottom -
            gameRect.top - 3
    };
}


/* =====================================================
   BIRD HITBOX
===================================================== */

function getBirdBox(b){

    /*
       Small hitbox to avoid
       false collisions.
    */

    return {

        left:
            b.x + 10,

        right:
            b.x + 43,

        top:
            b.y + 10,

        bottom:
            b.y + 34
    };
}


/* =====================================================
   SPEED
===================================================== */

function getGameSpeed(){

    /*
       Stage 1 = 5
       Stage 2 = 5.35
       Stage 3 = 5.70
       Stage 4 = 6.05
       Stage 5 = 6.40

       Stage 6+
       +0.5 every stage.
    */

    if(stage <= 5){

        return 5 +
            (stage - 1) * 0.35;
    }

    return 6.4 +
        (stage - 5) * 0.5;
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

    if(!gameStarted || gameOver)
        return;

    const delta =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime = time;

    updatePlayer(delta);

    updateScore(delta);

    updateStageIfNeeded();

    updateObstacles(delta);

    updateBullets(delta);

    updateBirds(delta);

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   PLAYER PHYSICS
===================================================== */

function updatePlayer(delta){

    if(stage === 3){

        playerY = 0;
        velocityY = 0;
        jumping = false;

    }else{

        if(jumping){

            velocityY -=
                gravity * delta;

            playerY +=
                velocityY * delta;

            if(playerY <= 0){

                playerY = 0;
                velocityY = 0;
                jumping = false;
            }
        }
    }

    /*
       Apply vertical jump.
       DUCK is applied separately by CSS.
    */

    if(!ducking){

        player.style.transform =
            `translateY(${-playerY}px)`;

    }else if(stage === 3){

        player.style.transform =
            "translateY(24px) scaleY(.60)";
    }
}


/* =====================================================
   SCORE
===================================================== */

function updateScore(delta){

    score +=
        0.025 * delta;

    scoreText.textContent =
        "SCORE: " +
        Math.floor(score);
}


/* =====================================================
   STAGE CHANGE
===================================================== */

function updateStageIfNeeded(){

    const newStage =
        Math.floor(score / 50) + 1;

    if(newStage !== stage){

        stage = newStage;

        /*
           Clean previous stage.
        */

        clearObjects();

        obstacleTimer = 0;
        birdTimer = 0;

        playerY = 0;
        velocityY = 0;

        jumping = false;
        ducking = false;

        player.classList.remove("duck");

        player.style.transform =
            "translateY(0)";

        updateStage();

        showStageMessage();
    }
}


/* =====================================================
   STAGE MESSAGE
===================================================== */

function showStageMessage(){

    message.style.display = "block";

    message.textContent =
        "STAGE " + stage;

    setTimeout(()=>{

        if(!gameOver){

            message.style.display =
                "none";
        }

    },1200);
}


/* =====================================================
   OBSTACLES
===================================================== */

function updateObstacles(delta){

    if(stage === 3)
        return;

    obstacleTimer += delta;

    let spawnTime;

    if(stage <= 5){

        spawnTime =
            stage === 1
            ? 100
            : 115;

    }else{

        /*
           Obstacles spawn faster
           after Stage 5.
        */

        spawnTime =
            Math.max(
                55,
                115 -
                (stage - 5) * 3
