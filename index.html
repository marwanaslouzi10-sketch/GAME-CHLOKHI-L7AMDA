<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dog Runner V5</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    touch-action:none;
}


/* =========================
   GAME / MAP
========================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        #70caff,
        #dff7ff 70%,
        #ffffff
    );

    transition:background 1s;
}


/* MAP 1 */

.map1{
    background:
    linear-gradient(
        #70caff 0%,
        #cceeff 65%,
        #8bd36f 65%,
        #5cad43 100%
    ) !important;
}


/* MAP 2 - MILITARY */

.map2{
    background:
    linear-gradient(
        #68757b 0%,
        #aeb8bb 60%,
        #59635f 60%,
        #3f4642 100%
    ) !important;
}


/* MAP 3 - SKY */

.map3{
    background:
    linear-gradient(
        #263b8f 0%,
        #6c8cff 55%,
        #b9d7ff 100%
    ) !important;
}


/* MAP 4 - VOLCANO */

.map4{
    background:
    linear-gradient(
        #351313 0%,
        #812525 55%,
        #31110d 55%,
        #160908 100%
    ) !important;
}


/* MAP 5 */

.map5{
    background:
    linear-gradient(
        #151515 0%,
        #343434 55%,
        #151515 55%,
        #080808 100%
    ) !important;
}


/* =========================
   START SCREEN
========================= */

#startScreen{
    position:absolute;
    inset:0;

    z-index:500;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
    linear-gradient(
        135deg,
        #071c35,
        #143f69
    );

    color:white;
}

#startScreen h1{
    font-size:45px;
    margin-bottom:10px;
}

#startScreen p{
    margin-bottom:30px;
    color:#d7e8f5;
}

#playButton{
    width:190px;
    height:70px;

    border:none;
    border-radius:40px;

    background:#e53935;

    color:white;

    font-size:28px;
    font-weight:bold;

    box-shadow:0 7px 0 #9c1715;
}

#playButton:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #9c1715;
}


/* =========================
   HUD
========================= */

#hud{
    position:absolute;

    top:15px;
    left:15px;

    z-index:100;

    font-size:21px;
    font-weight:bold;

    color:white;

    text-shadow:
    1px 1px 3px #000;
}


/* =========================
   MAP TITLE
========================= */

#mapName{
    position:absolute;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    padding:8px 18px;

    border-radius:20px;

    background:rgba(0,0,0,.35);

    color:white;

    font-weight:bold;
}


/* =========================
   SUN / MOON
========================= */

#sun{
    position:absolute;

    width:70px;
    height:70px;

    top:35px;
    right:35px;

    border-radius:50%;

    background:#ffd83d;

    transition:all 1s;
}

.map2 #sun{
    background:#cfd8dc;
}

.map3 #sun{
    background:#eee;
}

.map4 #sun{
    background:#ff5722;
    box-shadow:
    0 0 35px #ff5722;
}

.map5 #sun{
    background:#8e8e8e;
}


/* =========================
   PLAYER
========================= */

#player{
    position:absolute;

    left:75px;
    bottom:95px;

    width:75px;
    height:75px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:58px;

    z-index:50;

    transition:transform .1s;
}

#player.duck{
    transform:
    translateY(25px)
    scaleY(.65);
}


/* =========================
   GROUND
========================= */

#ground{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:95px;

    background:#4caf50;

    border-top:7px solid #286e2c;

    z-index:20;

    transition:
    background .8s,
    border-color .8s;
}


/* MAP GROUNDS */

.map2 #ground{
    background:#4c5551;
    border-color:#272b29;
}

.map3 #ground{
    background:#7888bd;
    border-color:#4d5c91;
}

.map4 #ground{
    background:#21100d;
    border-color:#ff3d00;
}

.map5 #ground{
    background:#181818;
    border-color:#555;
}


/* =========================
   WALL
========================= */

.wall{
    position:absolute;

    right:-80px;
    bottom:95px;

    width:58px;
    height:65px;

    background:
    repeating-linear-gradient(
        90deg,
        #754018 0px,
        #754018 12px,
        #995321 12px,
        #995321 24px
    );

    border:5px solid #54280c;

    border-radius:4px;

    z-index:30;
}


/* Military wall */

.map2 .wall{
    background:
    repeating-linear-gradient(
        90deg,
        #3f493b 0px,
        #3f493b 12px,
        #69765d 12px,
        #69765d 24px
    );

    border-color:#252a22;
}


/* Volcano obstacle */

.map4 .wall{
    background:
    linear-gradient(
        135deg,
        #ff5722,
        #6d1c0d
    );

    border-color:#2a0905;

    box-shadow:
    0 0 12px #ff5722;
}


/* =========================
   HEALTH BAR
========================= */

.healthBar{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    top:-17px;

    width:55px;
    height:8px;

    background:#222;

    border-radius:5px;

    overflow:hidden;
}

.healthFill{
    width:100%;
    height:100%;

    background:#e53935;
}


/* =========================
   BIRDS
========================= */

.bird{
    position:absolute;

    right:-90px;

    font-size:48px;

    z-index:35;
}


/* =========================
   BULLET
========================= */

.bullet{
    position:absolute;

    width:14px;
    height:5px;

    background:#ffd740;

    border-radius:5px;

    z-index:80;
}


/* =========================
   BUTTONS
========================= */

.controls{
    position:absolute;

    right:20px;
    bottom:120px;

    display:flex;

    gap:10px;

    z-index:150;
}

.gameButton{
    width:125px;
    height:60px;

    border:none;

    border-radius:30px;

    color:white;

    font-size:18px;
    font-weight:bold;

    box-shadow:
    0 5px 0 rgba(0,0,0,.3);
}

.gameButton:active{
    transform:translateY(4px);

    box-shadow:
    0 1px 0 rgba(0,0,0,.3);
}

#jumpButton{
    background:#e53935;
}

#shootButton{
    background:#263238;

    display:none;
}

#duckButton{
    background:#1976d2;

    display:none;
}


/* =========================
   STAGE MESSAGE
========================= */

#stageMessage{
    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    z-index:300;

    display:none;

    min-width:260px;

    padding:25px;

    border-radius:20px;

    background:
    rgba(0,0,0,.78);

    color:white;

    text-align:center;
}

#stageMessage h2{
    font-size:35px;

    margin-bottom:8px;
}

#stageMessage p{
    color:#ddd;
}


/* =========================
   GAME OVER
========================= */

#gameOver{
    position:absolute;

    inset:0;

    z-index:400;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
    rgba(0,0,0,.75);

    color:white;
}

#gameOver h1{
    font-size:45px;

    margin-bottom:10px;
}

#gameOver p{
    font-size:22px;
}

#restart{
    margin-top:25px;

    padding:14px 35px;

    border:none;

    border-radius:30px;

    background:#2196f3;

    color:white;

    font-size:20px;
    font-weight:bold;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #startScreen h1{
        font-size:38px;
    }

    #player{
        left:55px;
    }

    .controls{
        right:12px;
        bottom:115px;
    }

    .gameButton{
        width:115px;
        height:58px;
    }

}

</style>
</head>


<body>


<div id="game" class="map1">


    <!-- SUN -->

    <div id="sun"></div>


    <!-- START -->

    <div id="startScreen">

        <h1>
            🐕 DOG RUNNER
        </h1>

        <p>
            Jump • Shoot • Duck
        </p>

        <button id="playButton">
            PLAY ▶
        </button>

    </div>


    <!-- HUD -->

    <div id="hud">

        Score:
        <span id="score">0</span>

        <br>

        Stage:
        <span id="stage">1</span>

    </div>


    <!-- MAP NAME -->

    <div id="mapName">
        🌳 GREEN PARK
    </div>


    <!-- PLAYER -->

    <div id="player">
        🐕
    </div>


    <!-- GROUND -->

    <div id="ground"></div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="jumpButton"
            class="gameButton"
        >
            JUMP 🦘
        </button>


        <button
            id="shootButton"
            class="gameButton"
        >
            SHOOT 🔫
        </button>


        <button
            id="duckButton"
            class="gameButton"
        >
            DUCK 🔽
        </button>

    </div>


    <!-- STAGE MESSAGE -->

    <div id="stageMessage">

        <h2 id="stageTitle">
            STAGE 2
        </h2>

        <p id="stageText">
            Military Mode
        </p>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <h1>
            GAME OVER 💥
        </h1>

        <p>
            Score:
            <span id="finalScore">0</span>
        </p>

        <button id="restart">
            RESTART 🔄
        </button>

    </div>


</div>


<script>

/* =========================
   ELEMENTS
========================= */

const game =
document.getElementById("game");

const player =
document.getElementById("player");

const scoreElement =
document.getElementById("score");

const stageElement =
document.getElementById("stage");

const mapName =
document.getElementById("mapName");

const startScreen =
document.getElementById("startScreen");

const playButton =
document.getElementById("playButton");

const jumpButton =
document.getElementById("jumpButton");

const shootButton =
document.getElementById("shootButton");

const duckButton =
document.getElementById("duckButton");

const gameOver =
document.getElementById("gameOver");

const finalScore =
document.getElementById("finalScore");

const restart =
document.getElementById("restart");

const stageMessage =
document.getElementById("stageMessage");

const stageTitle =
document.getElementById("stageTitle");

const stageText =
document.getElementById("stageText");


/* =========================
   VARIABLES
========================= */

let playing=false;

let score=0;

let stage=1;

let playerY=0;

let velocity=0;

let jumping=false;

let ducking=false;

let speed=5;

let spawnTimer=0;

let nextSpawn=140;

let objects=[];

let bullets=[];


/* =========================
   PHYSICS
========================= */

const gravity=.75;

const jumpPower=13;


/* =========================
   RANDOM
========================= */

function random(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


/* =========================
   PLAY
========================= */

playButton.addEventListener(
    "click",
    startGame
);


function startGame(){

    startScreen.style.display=
    "none";

    playing=true;

    gameLoop();

}


/* =========================
   JUMP
========================= */

function jump(){

    if(!playing)
    return;

    if(stage!==1)
    return;

    if(jumping)
    return;

    jumping=true;

    velocity=jumpPower;

}


/* =========================
   DUCK
========================= */

function startDuck(){

    if(!playing)
    return;

    if(stage<3)
    return;

    ducking=true;

    player.classList.add(
        "duck"
    );

}


function stopDuck(){

    ducking=false;

    player.classList.remove(
        "duck"
    );

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!playing)
    return;

    if(stage!==2)
    return;


    const bullet=
    document.createElement("div");

    bullet.className=
    "bullet";


    const box=
    player.getBoundingClientRect();


    bullet.style.left=
    (box.right-5)+"px";

    bullet.style.top=
    (box.top+32)+"px";


    game.appendChild(
        bullet
    );


    bullets.push({

        element:bullet,

        x:box.right

    });

}


/* =========================
   BUTTON EVENTS
========================= */

jumpButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        jump();

    },
    {passive:false}
);

jumpButton.addEventListener(
    "click",
    jump
);


shootButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        shoot();

    },
    {passive:false}
);

shootButton.addEventListener(
    "click",
    shoot
);


duckButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        startDuck();

    },
    {passive:false}
);


duckButton.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        stopDuck();

    },
    {passive:false}
);


duckButton.addEventListener(
    "mousedown",
    startDuck
);

duckButton.addEventListener(
    "mouseup",
    stopDuck
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            jump();

        }


        if(
            e.code==="ArrowDown"
        ){

            startDuck();

        }


        if(
            e.code==="KeyX"
        ){

            shoot();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(
            e.code==="ArrowDown"
        ){

            stopDuck();

        }

    }
);


/* =========================
   CREATE WALL
========================= */

function createWall(){

    const wall=
    document.createElement(
        "div"
    );

    wall.className=
    "wall";

    wall.style.right=
    "-80px";


    if(stage===2){

        wall.dataset.hp=3;


        const bar=
        document.createElement(
            "div"
        );

        bar.className=
        "healthBar";


        const fill=
        document.createElement(
            "div"
        );

        fill.className=
        "healthFill";


        bar.appendChild(fill);

        wall.appendChild(bar);

    }


    game.appendChild(
        wall
    );


    objects.push({

        element:wall,

        type:"wall",

        hp:
        stage===2 ? 3 : 1,

        passed:false

    });

}


/* =========================
   CREATE BIRD
========================= */

function createBird(){

    const bird=
    document.createElement(
        "div"
    );

    bird.className=
    "bird";

    bird.textContent="🐦";


    bird.style.top=
    random(145,230)+"px";

    bird.style.right=
    "-90px";


    game.appendChild(
        bird
    );


    objects.push({

        element:bird,

        type:"bird",

        passed:false

    });

}


/* =========================
   COLLISION
========================= */

function collision(a,b){

    const A=
    a.getBoundingClientRect();

    const B=
    b.getBoundingClientRect();


    return(
        A.left<B.right &&
        A.right>B.left &&
        A.top<B.bottom &&
        A.bottom>B.top
    );

}


/* =========================
   CHECK OBJECTS
========================= */

function checkObjects(){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const obj=
        objects[i];

        const element=
        obj.element;


        const box=
        element.getBoundingClientRect();

        const playerBox=
        player.getBoundingClientRect();


        /*
           بعيد بزاف
        */

        if(
            box.left>
            playerBox.right+20
        ){

            continue;

        }


        /*
           داز
        */

        if(
            box.right<
            playerBox.left
        ){

            continue;

        }


        /* WALL */

        if(
            obj.type==="wall"
        ){

            if(
                collision(
                    player,
                    element
                )
            ){

                endGame();

                return;

            }

        }


        /* BIRD */

        if(
            obj.type==="bird"
        ){

            if(
                !ducking &&
                collision(
                    player,
                    element
                )
            ){

                endGame();

                return;

            }

        }

    }

}


/* =========================
   BULLETS
========================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
        bullets[i];


        let x=
        parseFloat(
            bullet.element.style.left
        );


        x+=13;


        bullet.element.style.left=
        x+"px";


        for(
            let j=objects.length-1;
            j>=0;
            j--
        ){

            const obj=
            objects[j];


            if(
                obj.type!=="wall"
            )
            continue;


            if(
                collision(
                    bullet.element,
                    obj.element
                )
            ){

                obj.hp--;


                const fill=
                obj.element.querySelector(
                    ".healthFill"
                );


                if(fill){

                    fill.style.width=
                    (obj.hp/3*100)+"%";

                }


                if(
                    obj.hp<=0
                ){

                    obj.element.remove();

                    objects.splice(
                        j,
                        1
                    );

                }


                bullet.element.remove();

                bullets.splice(
                    i,
                    1
                );

                break;

            }

        }


        if(
            x>
            window.innerWidth+100
        ){

            bullet.element.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================
   CHANGE MAP
========================= */

function changeMap(){

    game.classList.remove(
        "map1",
        "map2",
        "map3",
        "map4",
        "map5"
    );


    /* STAGE 1 */

    if(stage===1){

        game.classList.add(
            "map1"
        );

        mapName.textContent=
        "🌳 GREEN PARK";

        player.textContent=
        "🐕";

        jumpButton.style.display=
        "block";

        shootButton.style.display=
        "none";

        duckButton.style.display=
        "none";

    }


    /* STAGE 2 */

    else if(stage===2){

        game.classList.add(
            "map2"
        );

        mapName.textContent=
        "🪖 MILITARY BASE";

        player.textContent=
        "🪖";

        jumpButton.style.display=
        "none";

        shootButton.style.display=
        "block";

        duckButton.style.display=
        "none";

    }


    /* STAGE 3 */

    else if(stage===3){

        game.classList.add(
            "map3"
        );

        mapName.textContent=
        "☁️ SKY ZONE";

        player.textContent=
        "🐕";

        jumpButton.style.display=
        "none";

        shootButton.style.display=
        "none";

        duckButton.style.display=
        "block";

    }


    /* STAGE 4 */

    else if(stage===4){

        game.classList.add(
            "map4"
        );

        mapName.textContent=
        "🌋 VOLCANO";

        player.textContent=
        "🐕";

        jumpButton.style.display=
        "none";

        shootButton.style.display=
        "none";

        duckButton.style.display=
        "block";

    }


    /* STAGE 5+ */

    else
