<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

button{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* ================= MAPS ================= */

.stage1{
    background:linear-gradient(
        #55c6ff 0%,
        #c9f0ff 58%,
        #71c653 58%,
        #369532 100%
    );
}

.stage2{
    background:linear-gradient(
        #899398 0%,
        #c9cdcf 55%,
        #606568 55%,
        #303336 100%
    );
}

.stage3{
    background:linear-gradient(
        #20adf5 0%,
        #8cdeff 65%,
        #e5f8ff 100%
    );
}

.stage4{
    background:linear-gradient(
        #ffae50 0%,
        #e65d32 50%,
        #70241d 75%,
        #250909 100%
    );
}

.stage5{
    background:linear-gradient(
        #11172b 0%,
        #202945 55%,
        #080a11 100%
    );
}

.stage6{
    background:linear-gradient(
        #070918 0%,
        #181c38 55%,
        #030409 100%
    );
}

/* ================= GROUND ================= */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:18%;
    background:#399c32;
    z-index:5;
}

.stage2 #ground{
    background:#34383b;
}

.stage3 #ground{
    background:rgba(255,255,255,.3);
}

.stage4 #ground{
    background:#301010;
}

.stage5 #ground,
.stage6 #ground{
    background:#08090e;
}

/* ================= SCORE ================= */

#score{
    position:absolute;
    top:14px;
    left:15px;
    z-index:100;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}

#stageText{
    position:absolute;
    top:47px;
    left:15px;
    z-index:100;
    color:white;
    font-size:19px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}

/* ================= MESSAGE ================= */

#message{
    position:absolute;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:200;
    color:white;
    font-size:43px;
    font-weight:bold;
    text-align:center;
    text-shadow:3px 3px 7px #000;
    pointer-events:none;
}

/* ================= PLAY ================= */

#playButton{
    position:absolute;
    top:58%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:250;

    width:210px;
    height:75px;

    border:none;
    border-radius:16px;

    background:#22c55e;
    color:white;

    font-size:30px;
    font-weight:bold;

    box-shadow:0 6px 0 #15803d;

    cursor:pointer;
    touch-action:manipulation;
}

#playButton:active{
    transform:translate(-50%,-46%);
    box-shadow:0 2px 0 #15803d;
}

/* ================= PLAYER ================= */

#player{
    position:absolute;

    left:11%;
    bottom:18%;

    width:70px;
    height:70px;

    z-index:20;

    font-size:52px;
    line-height:70px;
    text-align:center;

    transform:translateY(0);
}

#player.duck{
    transform:
        translateY(24px)
        scaleY(.60);
}

/* ================= CONTROLS ================= */

.control{
    position:absolute;
    right:25px;
    bottom:25px;

    width:125px;
    height:65px;

    z-index:150;

    border:none;
    border-radius:15px;

    color:white;
    font-size:22px;
    font-weight:bold;

    box-shadow:0 5px 0 rgba(0,0,0,.35);

    touch-action:none;
}

#jumpButton{
    background:#2563eb;
}

#shootButton{
    background:#dc2626;
    display:none;
}

#duckButton{
    background:#9333ea;
    display:none;
}

.control:active{
    transform:translateY(4px);
}

/* ================= OBSTACLE ================= */

.obstacle{
    position:absolute;

    width:42px;
    height:65px;

    bottom:18%;

    background:#8b4513;

    border:4px solid #5b2c0c;

    border-radius:4px;

    z-index:10;
}

.obstacle::before{
    content:"";

    position:absolute;

    left:4px;
    top:12px;

    width:26px;
    height:5px;

    background:#c27a3c;

    transform:rotate(-10deg);
}

.obstacle::after{
    content:"";

    position:absolute;

    left:5px;
    top:35px;

    width:25px;
    height:5px;

    background:#c27a3c;

    transform:rotate(8deg);
}

.hpText{
    position:absolute;

    top:-25px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:18px;
    font-weight:bold;

    text-shadow:2px 2px 3px #000;
}

/* ================= BULLET ================= */

.bullet{
    position:absolute;

    width:16px;
    height:6px;

    background:#ffd000;

    border-radius:5px;

    z-index:30;
}

/* ================= BIRD ================= */

.bird{
    position:absolute;

    width:55px;
    height:45px;

    font-size:42px;

    z-index:15;
}

</style>
</head>

<body>

<div id="game" class="stage1">

    <div id="score">SCORE: 0</div>

    <div id="stageText">
        STAGE 1 - DAY
    </div>

    <div id="message">
        DOG RUNNER
    </div>

    <button id="playButton" type="button">
        PLAY
    </button>

    <div id="player">🐕</div>

    <div id="ground"></div>

    <button id="jumpButton" class="control" type="button">
        JUMP
    </button>

    <button id="shootButton" class="control" type="button">
        SHOOT
    </button>

    <button id="duckButton" class="control" type="button">
        DUCK
    </button>

</div>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const stageText =
    document.getElementById("stageText");

const message =
    document.getElementById("message");

const playButton =
    document.getElementById("playButton");

const jumpButton =
    document.getElementById("jumpButton");

const shootButton =
    document.getElementById("shootButton");

const duckButton =
    document.getElementById("duckButton");


/* =====================================================
   VARIABLES
===================================================== */

let gameStarted = false;
let gameOver = false;

let score = 0;
let stage = 1;

let playerY = 0;
let velocityY = 0;

const gravity = 0.75;
const jumpPower = 13;

let jumping = false;
let ducking = false;

let obstacles = [];
let bullets = [];
let birds = [];

let obstacleTimer = 0;
let birdTimer = 0;

let lastTime = 0;


/* =====================================================
   PLAY / RESTART
   ONE BUTTON SYSTEM
===================================================== */

function playButtonAction(e){

    if(e){
        e.preventDefault();
    }

    if(gameOver){

        restartGame();

    }else if(!gameStarted){

        startGame();
    }
}


/*
   pointerdown works on:
   - Android
   - iPhone
   - PC
*/

playButton.addEventListener(
    "pointerdown",
    playButtonAction
);


/* Prevent double touch */
playButton.addEventListener(
    "click",
    function(e){
        e.preventDefault();
    }
);


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    if(gameStarted)
        return;

    gameStarted = true;
    gameOver = false;

    score = 0;
    stage = 1;

    playerY = 0;
    velocityY = 0;

    jumping = false;
    ducking = false;

    obstacleTimer = 0;
    birdTimer = 0;

    clearObjects();

    player.classList.remove("duck");

    player.style.transform =
        "translateY(0)";

    player.textContent =
        "🐕";

    message.style.display =
        "none";

    playButton.style.display =
        "none";

    scoreText.textContent =
        "SCORE: 0";

    updateStage();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(
        !gameStarted ||
        gameOver
    )
        return;

    if(stage === 3)
        return;

    if(jumping)
        return;

    jumping = true;

    velocityY =
        jumpPower;
}


jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();
    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();
        }


        if(
            e.code === "ArrowDown" &&
            stage === 3
        ){

            startDuck(e);
        }


        if(e.code === "KeyX"){

            shoot();
        }
    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.code === "ArrowDown"){

            stopDuck(e);
        }
    }
);


/* =====================================================
   DUCK
===================================================== */

function startDuck(e){

    if(e)
        e.preventDefault();

    if(
        !gameStarted ||
        gameOver ||
        stage !== 3
    )
        return;

    ducking = true;

    player.classList.add(
        "duck"
    );
}


function stopDuck(e){

    if(e)
        e.preventDefault();

    ducking = false;

    player.classList.remove(
        "duck"
    );
}


/*
   Pointer events make DUCK
   reliable on phones.
*/

duckButton.addEventListener(
    "pointerdown",
    startDuck
);

duckButton.addEventListener(
    "pointerup",
    stopDuck
);

duckButton.addEventListener(
    "pointercancel",
    stopDuck
);

duckButton.addEventListener(
    "pointerleave",
    stopDuck
);


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        !gameStarted ||
        gameOver ||
        stage !== 2
    )
        return;

    const rect =
        player.getBoundingClientRect();

    const gameRect =
        game.getBoundingClientRect();

    const bullet =
        document.createElement("div");

    bullet.className =
        "bullet";

    bullet.x =
        rect.right -
        gameRect.left;

    bullet.y =
        rect.top -
        gameRect.top +
        30;

    bullet.style.left =
        bullet.x + "px";

    bullet.style.top =
        bullet.y + "px";

    game.appendChild(
        bullet
    );

    bullets.push(
        bullet
    );
}


shootButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        shoot();
    }
);


/* =====================================================
   CREATE OBSTACLE
===================================================== */

function createObstacle(){

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "obstacle";

    obstacle.x =
        window.innerWidth + 30;

    obstacle.hp = 3;

    obstacle.style.left =
        obstacle.x + "px";


    if(stage === 2){

        const hp =
            document.createElement("div");

        hp.className =
            "hpText";

        hp.textContent =
            "3";

        obstacle.appendChild(
            hp
        );

        obstacle.hpText =
            hp;
    }


    game.appendChild(
        obstacle
    );

    obstacles.push(
        obstacle
    );
}


/* =====================================================
   CREATE BIRD
===================================================== */

function createBird(){

    const bird =
        document.createElement("div");

    bird.className =
        "bird";

    bird.textContent =
        "🦅";

    bird.x =
        window.innerWidth + 60;

    /*
       Raised higher than before.
    */

    bird.y =
        game.clientHeight *
        0.82 - 105;

    bird.y +=
        Math.random() *
        15 - 7;

    bird.style.left =
        bird.x + "px";

    bird.style.top =
        bird.y + "px";

    game.appendChild(
        bird
    );

    birds.push(
        bird
    );
}


/* =====================================================
   CLEAR
===================================================== */

function clearObjects(){

    obstacles.forEach(
        o => o.remove()
    );

    bullets.forEach(
        b => b.remove()
    );

    birds.forEach(
        b => b.remove()
    );

    obstacles = [];
    bullets = [];
    birds = [];
}


/* =====================================================
   STAGE
===================================================== */

function updateStage(){

    updateMap();
    updateControls();


    if(stage === 1){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 1 - DAY";
    }


    else if(stage === 2){

        player.textContent =
            "🪖🐕";

        stageText.textContent =
            "STAGE 2 - MILITARY DAY";
    }


    else if(stage === 3){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 3 - SKY DAY";
    }


    else if(stage === 4){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 4 - VOLCANO";
    }


    else if(stage === 5){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 5 - NIGHT";
    }


    else{

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE " +
            stage +
            " - DARK ZONE";
    }
}


/* =====================================================
   MAP
===================================================== */

function updateMap(){

    game.className = "";

    if(stage === 1)
        game.classList.add("stage1");

    else if(stage === 2)
        game.classList.add("stage2");

    else if(stage === 3)
        game.classList.add("stage3");

    else if(stage === 4)
        game.classList.add("stage4");

    else if(stage === 5)
        game.classList.add("stage5");

    else
        game.classList.add("stage6");
}


/* =====================================================
   CONTROLS
===================================================== */

function updateControls(){

    jumpButton.style.display =
        (
            stage === 1 ||
            stage >= 4
        )
        ? "block"
        : "none";


    shootButton.style.display =
        stage === 2
        ? "block"
        : "none";


    duckButton.style.display =
        stage === 3
        ? "block"
        : "none";
}


/* =====================================================
   PLAYER HITBOX
===================================================== */

function getPlayerBox(){

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        player.getBoundingClientRect();


    /* Stage 3 = HEAD */

    if(stage === 3){

        if(ducking){

            return {

                left:
                    rect.left -
                    gameRect.left + 25,

                right:
                    rect.right -
                    gameRect.left - 25,

                top:
                    rect.top -
                    gameRect.top + 36,

                bottom:
                    rect.top -
                    gameRect.top + 58
            };
        }


        return {

            left:
                rect.left -
                gameRect.left + 18,

            right:
                rect.right -
                gameRect.left - 18,

            top:
                rect.top -
                gameRect.top + 10,

            bottom:
                rect.top -
                gameRect.top + 38
        };
    }


    /* Other stages = FEET */

    return {

        left:
            rect.left -
            gameRect.left + 22,

        right:
            rect.right -
            gameRect.left - 22,

        top:
            rect.bottom -
            gameRect.top - 28,

        bottom:
            rect.bottom -
            gameRect.top - 3
    };
}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

    return(
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}


/* =====================================================
   OBSTACLE BOX
===================================================== */

function getObstacleBox(o){

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        o.getBoundingClientRect();

    return {

        left:
            rect.left -
            gameRect.left + 5,

        right:
            rect.right -
            gameRect.left - 5,

        top:
            rect.top -
            gameRect.top + 3,

        bottom:
            rect.bottom -
            gameRect.top - 3
    };
}


/* =====================================================
   BIRD BOX
===================================================== */

function getBirdBox(b){

    return {

        left:
            b.x + 10,

        right:
            b.x + 43,

        top:
            b.y + 10,

        bottom:
            b.y + 34
    };
}


/* =====================================================
   SPEED
===================================================== */

function getGameSpeed(){

    /*
       1 = 5
       2 = 5.35
       3 = 5.70
       4 = 6.05
       5 = 6.40

       6+ = +0.5 every stage
    */

    if(stage <= 5){

        return 5 +
            (stage - 1) * 0.35;
    }

    return 6.4 +
        (stage - 5) * 0.5;
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

    if(
        !gameStarted ||
        gameOver
    )
        return;


    const delta =
        Math.min(
            (time-lastTime) /
            16.67,
            2
        );


    lastTime =
        time;


    updatePlayer(delta);

    updateScore(delta);

    updateStageIfNeeded();

    updateObstacles(delta);

    updateBullets(delta);

    updateBirds(delta);


    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   PLAYER PHYSICS
===================================================== */

function updatePlayer(delta){

    if(stage === 3){

        playerY = 0;
        velocityY = 0;
        jumping = false;

    }else{

        if(jumping){

            velocityY -=
                gravity * delta;

            playerY +=
                velocityY * delta;


            if(playerY <= 0){

                playerY = 0;

                velocityY = 0;

                jumping = false;
            }
        }
    }


    if(
        ducking &&
        stage === 3
    ){

        player.style.transform =
            "translateY(24px) scaleY(.60)";

    }else{

        player.style.transform =
            `translateY(${-playerY}px)`;
    }
}


/* =====================================================
   SCORE
===================================================== */

function updateScore(delta){

    score +=
        0.025 * delta;

    scoreText.textContent =
        "SCORE: " +
        Math.floor(score);
}


/* =====================================================
   STAGE CHANGE
===================================================== */

function updateStageIfNeeded(){

    const newStage =
        Math.floor(score / 50) + 1;


    if(newStage !== stage){

        stage =
            newStage;


        /*
           Delete everything from
           previous stage.
        */

        clearObjects()
