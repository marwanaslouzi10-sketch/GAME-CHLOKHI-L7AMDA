<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dog Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#58c5ff;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(
        #58c5ff 0%,
        #c8efff 58%,
        #70c653 58%,
        #369530 100%
    );
}

/* MAPS */

#game.stage1{
    background:linear-gradient(
        #58c5ff 0%,
        #c8efff 58%,
        #70c653 58%,
        #369530 100%
    );
}

#game.stage2{
    background:linear-gradient(
        #8b959a 0%,
        #c7cbcd 55%,
        #606568 55%,
        #303336 100%
    );
}

#game.stage3{
    background:linear-gradient(
        #20adf5 0%,
        #8cdeff 65%,
        #e5f8ff 100%
    );
}

#game.stage4{
    background:linear-gradient(
        #ffae50 0%,
        #e65d32 50%,
        #70241d 75%,
        #250909 100%
    );
}

#game.stage5{
    background:linear-gradient(
        #11172b 0%,
        #202945 55%,
        #080a11 100%
    );
}

#game.stage6{
    background:linear-gradient(
        #070918 0%,
        #181c38 55%,
        #030409 100%
    );
}

/* GROUND */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:18%;
    background:#399c32;
    z-index:5;
}

.stage2 #ground{
    background:#34383b;
}

.stage3 #ground{
    background:rgba(255,255,255,.25);
}

.stage4 #ground{
    background:#301010;
}

.stage5 #ground,
.stage6 #ground{
    background:#08090e;
}

/* SCORE */

#score{
    position:absolute;
    top:15px;
    left:15px;
    z-index:100;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#stage{
    position:absolute;
    top:48px;
    left:15px;
    z-index:100;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

/* PLAYER */

#player{
    position:absolute;
    left:11%;
    bottom:18%;
    width:70px;
    height:70px;
    z-index:20;

    font-size:50px;
    line-height:70px;
    text-align:center;

    transform:translateY(0);
}

#player.duck{
    transform:
        translateY(24px)
        scaleY(.6);
}

/* BUTTONS */

.control{
    position:absolute;
    right:25px;
    bottom:25px;

    width:125px;
    height:65px;

    border:0;
    border-radius:15px;

    color:white;
    font-size:21px;
    font-weight:bold;

    z-index:100;

    touch-action:none;
}

#jump{
    background:#2563eb;
}

#shoot{
    background:#dc2626;
    display:none;
}

#duck{
    background:#9333ea;
    display:none;
}

/* WOOD */

.obstacle{
    position:absolute;

    width:42px;
    height:65px;

    bottom:18%;

    background:#8b4513;
    border:4px solid #5b2c0c;

    border-radius:4px;

    z-index:10;
}

.obstacle:before{
    content:"";
    position:absolute;

    left:4px;
    top:12px;

    width:26px;
    height:5px;

    background:#c27a3c;

    transform:rotate(-10deg);
}

.obstacle:after{
    content:"";
    position:absolute;

    left:5px;
    top:35px;

    width:25px;
    height:5px;

    background:#c27a3c;

    transform:rotate(8deg);
}

/* HP */

.hp{
    position:absolute;
    top:-25px;
    left:50%;

    transform:translateX(-50%);

    color:white;
    font-size:18px;
    font-weight:bold;

    text-shadow:2px 2px 3px black;
}

/* BULLET */

.bullet{
    position:absolute;

    width:16px;
    height:6px;

    background:#ffd000;

    border-radius:5px;

    z-index:30;
}

/* BIRD */

.bird{
    position:absolute;

    width:55px;
    height:45px;

    font-size:40px;

    z-index:15;
}

/* GAME OVER */

#gameOver{
    position:absolute;

    top:40%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:300;

    color:white;

    font-size:42px;
    font-weight:bold;

    text-align:center;

    text-shadow:3px 3px 7px black;

    display:none;

    pointer-events:none;
}

</style>
</head>

<body>

<div id="game">

    <div id="score">SCORE: 0</div>

    <div id="stage">
        STAGE 1 - DAY
    </div>

    <div id="gameOver">
        GAME OVER
    </div>

    <div id="player">🐕</div>

    <div id="ground"></div>

    <button id="jump" class="control">
        JUMP
    </button>

    <button id="shoot" class="control">
        SHOOT
    </button>

    <button id="duck" class="control">
        DUCK
    </button>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const stageText =
    document.getElementById("stage");

const gameOverText =
    document.getElementById("gameOver");

const jumpButton =
    document.getElementById("jump");

const shootButton =
    document.getElementById("shoot");

const duckButton =
    document.getElementById("duck");


/* =========================
   GAME VARIABLES
========================= */

let running = true;
let dead = false;

let score = 0;
let stage = 1;

let y = 0;
let velocity = 0;

let jumping = false;
let ducking = false;

let obstacles = [];
let bullets = [];
let birds = [];

let obstacleTimer = 0;
let birdTimer = 0;

let lastTime = performance.now();


/* =========================
   START
========================= */

function start(){

    running = true;
    dead = false;

    score = 0;
    stage = 1;

    y = 0;
    velocity = 0;

    jumping = false;
    ducking = false;

    obstacleTimer = 0;
    birdTimer = 0;

    clearAll();

    gameOverText.style.display = "none";

    player.textContent = "🐕";

    player.style.transform =
        "translateY(0)";

    updateStage();

    lastTime =
        performance.now();

    requestAnimationFrame(loop);
}


/* =========================
   JUMP
========================= */

function jump(){

    if(!running || dead)
        return;

    if(stage === 3)
        return;

    if(jumping)
        return;

    jumping = true;

    velocity = 13;
}


jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();
    }
);


/* =========================
   SHOOT
========================= */

function shoot(){

    if(
        !running ||
        dead ||
        stage !== 2
    )
        return;

    const r =
        player.getBoundingClientRect();

    const g =
        game.getBoundingClientRect();

    const bullet =
        document.createElement("div");

    bullet.className =
        "bullet";

    bullet.x =
        r.right - g.left;

    bullet.y =
        r.top - g.top + 30;

    bullet.style.left =
        bullet.x + "px";

    bullet.style.top =
        bullet.y + "px";

    game.appendChild(bullet);

    bullets.push(bullet);
}


shootButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        shoot();
    }
);


/* =========================
   DUCK
========================= */

function duckStart(e){

    if(e)
        e.preventDefault();

    if(
        !running ||
        dead ||
        stage !== 3
    )
        return;

    ducking = true;

    player.classList.add("duck");
}


function duckStop(e){

    if(e)
        e.preventDefault();

    ducking = false;

    player.classList.remove("duck");
}


duckButton.addEventListener(
    "pointerdown",
    duckStart
);

duckButton.addEventListener(
    "pointerup",
    duckStop
);

duckButton.addEventListener(
    "pointercancel",
    duckStop
);

duckButton.addEventListener(
    "pointerleave",
    duckStop
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();
        }

        if(
            e.code === "ArrowDown"
        ){

            duckStart(e);
        }

        if(
            e.code === "KeyX"
        ){

            shoot();
        }
    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(
            e.code === "ArrowDown"
        ){

            duckStop(e);
        }
    }
);


/* =========================
   OBSTACLE
========================= */

function createObstacle(){

    const o =
        document.createElement("div");

    o.className =
        "obstacle";

    o.x =
        window.innerWidth + 20;

    o.hp = 3;

    o.style.left =
        o.x + "px";


    if(stage === 2){

        const hp =
            document.createElement("div");

        hp.className = "hp";

        hp.textContent = "3";

        o.appendChild(hp);

        o.hpElement = hp;
    }


    game.appendChild(o);

    obstacles.push(o);
}


/* =========================
   BIRD
========================= */

function createBird(){

    const b =
        document.createElement("div");

    b.className =
        "bird";

    b.textContent =
        "🦅";

    b.x =
        window.innerWidth + 50;

    /* higher bird */

    b.y =
        game.clientHeight * .82 - 105;

    b.y +=
        Math.random() * 12 - 6;

    b.style.left =
        b.x + "px";

    b.style.top =
        b.y + "px";

    game.appendChild(b);

    birds.push(b);
}


/* =========================
   CLEAR
========================= */

function clearAll(){

    for(const o of obstacles)
        o.remove();

    for(const b of bullets)
        b.remove();

    for(const b of birds)
        b.remove();

    obstacles = [];
    bullets = [];
    birds = [];
}


/* =========================
   STAGE
========================= */

function updateStage(){

    game.className =
        "stage" +
        (
            stage >= 6
            ? 6
            : stage
        );


    jumpButton.style.display =
        (
            stage === 1 ||
            stage >= 4
        )
        ? "block"
        : "none";


    shootButton.style.display =
        stage === 2
        ? "block"
        : "none";


    duckButton.style.display =
        stage === 3
        ? "block"
        : "none";


    if(stage === 1){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 1 - DAY";
    }

    else if(stage === 2){

        player.textContent =
            "🪖🐕";

        stageText.textContent =
            "STAGE 2 - MILITARY DAY";
    }

    else if(stage === 3){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 3 - SKY DAY";
    }

    else if(stage === 4){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 4 - VOLCANO";
    }

    else if(stage === 5){

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE 5 - NIGHT";
    }

    else{

        player.textContent =
            "🐕";

        stageText.textContent =
            "STAGE " +
            stage +
            " - DARK ZONE";
    }
}


/* =========================
   PLAYER BOX
========================= */

function playerBox(){

    const gr =
        game.getBoundingClientRect();

    const r =
        player.getBoundingClientRect();


    if(stage === 3){

        if(ducking){

            return {

                left:
                    r.left - gr.left + 25,

                right:
                    r.right - gr.left - 25,

                top:
                    r.top - gr.top + 36,

                bottom:
                    r.top - gr.top + 58
            };
        }


        return {

            left:
                r.left - gr.left + 18,

            right:
                r.right - gr.left - 18,

            top:
                r.top - gr.top + 10,

            bottom:
                r.top - gr.top + 38
        };
    }


    return {

        left:
            r.left - gr.left + 22,

        right:
            r.right - gr.left - 22,

        top:
            r.bottom - gr.top - 28,

        bottom:
            r.bottom - gr.top - 3
    };
}


/* =========================
   COLLISION
========================= */

function hit(a,b){

    return(
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}


/* =========================
   LOOP
========================= */

function loop(time){

    if(!running || dead)
        return;


    const dt =
        Math.min(
            (time - lastTime) /
            16.67,
            2
        );

    lastTime = time;


    /* PLAYER */

    if(stage !== 3 && jumping){

        velocity -=
            .75 * dt;

        y +=
            velocity * dt;

        if(y <= 0){

            y = 0;
            velocity = 0;
            jumping = false;
        }
    }


    if(stage === 3){

        y = 0;
        velocity = 0;
        jumping = false;
    }


    if(
        ducking &&
        stage === 3
    ){

        player.style.transform =
            "translateY(24px) scaleY(.6)";

    }else{

        player.style.transform =
            `translateY(${-y}px)`;
    }


    /* SCORE */

    score +=
        .025 * dt;

    scoreText.textContent =
        "SCORE: " +
        Math.floor(score);


    /* STAGE */

    const newStage =
        Math.floor(score / 50) + 1;


    if(newStage !== stage){

        stage = newStage;

        clearAll();

        obstacleTimer = 0;
        birdTimer = 0;

        y = 0;
        velocity = 0;

        jumping = false;
        ducking = false;

        player.classList.remove("duck");

        updateStage();
    }


    /* OBSTACLES */

    if(stage !== 3){

        obstacleTimer += dt;

        let spawn =
            stage <= 5
            ? 110
            : Math.max(
                55,
                110 -
                (stage - 5) * 3
            );


        if(obstacleTimer >= spawn){

            obstacleTimer = 0;

            createObstacle();
        }


        let speed =
            stage <= 5
            ? 5 + (stage - 1) * .35
            : 6.4 + (stage - 5) * .5;


        const p =
            playerBox();


        for(
            let i=obstacles.length-1;
            i>=0;
            i--
        ){

            const o =
                obstacles[i];

            o.x -=
                speed * dt;

            o.style.left =
                o.x + "px";


            const ob = {

                left:o.x + 5,

                right:o.x + 37,

                top:
                    game.clientHeight *
                    .82 -
                    65,

                bottom:
                    game.clientHeight *
                    .82
            };


            if(
                hit(p,ob)
            ){

                endGame();

                return;
            }


            if(o.x < -80){

                o.remove();

                obstacles.splice(i,1);

                score += 5;
            }
        }
    }


    /* BULLETS */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];

        b.x +=
            12 * dt;

        b.style.left =
            b.x + "px";


        for(
            let j=obstacles.length-1;
            j>=0;
            j--
        ){

            const o =
                obstacles[j];


            if(
                b.x + 16 > o.x &&
                b.x < o.x + 42
            ){

                o.hp--;

                if(o.hpElement)
                    o.hpElement.textContent =
                        o.hp;


                b.remove();

                bullets.splice(i,1);


                if(o.hp <= 0){

                    o.remove();

                    obstacles.splice(j,1);

                    score += 3;
                }

                break;
            }
        }


        if(
            i < bullets.length &&
            b.x > window.innerWidth
        ){

            b.remove();

            bullets.splice(i,1);
        }
    }


    /* BIRDS */

    if(stage === 3){

        birdTimer += dt;


        if(birdTimer >= 90){

            birdTimer = 0;

            createBird();
        }


        const p =
            playerBox();


        for(
            let i=birds.length-1;
            i>=0;
            i--
        ){

            const b =
                birds[i];

            b.x -=
                6 * dt;

            b.style.left =
                b.x + "px";


            const bb = {

                left:b.x + 10,
                right:b.x + 43,
                top:b.y + 10,
                bottom:b.y + 34
            };


            if(hit(p,bb)){

                endGame();

                return;
            }


            if(b.x < -80){

                b.remove();

                birds.splice(i,1);

                score += 5;
            }
        }
    }


    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    if(dead)
        return;

    dead = true;
    running = false;

    gameOverText.innerHTML =
        "GAME OVER<br>" +
        "<span style='font-size:22px'>" +
        "SCORE: " +
        Math.floor(score) +
        "<br><br>TAP TO RESTART" +
        "</span>";

    gameOverText.style.display =
        "block";
}


/* =========================
   RESTART
========================= */

game.addEventListener(
    "pointerdown",
    function(){

        if(dead){

            start();
        }
    }
);


/* =========================
   START IMMEDIATELY
========================= */

updateStage();
start();

</script>

</body>
    </html>
