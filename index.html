<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Jump V3</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(
        #72c9ff 0%,
        #dff6ff 72%,
        #ffffff 100%
    );
}

/* SUN */
#sun{
    position:absolute;
    top:35px;
    right:35px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#ffd83d;
}

/* SCORE */
#score{
    position:absolute;
    top:20px;
    left:20px;
    z-index:50;
    font-size:25px;
    font-weight:bold;
    color:#111;
}

/* DOG */
#dog{
    position:absolute;
    left:80px;
    bottom:95px;
    width:65px;
    height:65px;
    font-size:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

/* GROUND */
#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:95px;
    background:#4caf50;
    border-top:7px solid #286e2c;
}

/* WALL */
.wall{
    position:absolute;
    right:-80px;
    bottom:95px;
    width:58px;
    height:75px;

    background:
    repeating-linear-gradient(
        90deg,
        #754018 0px,
        #754018 12px,
        #995321 12px,
        #995321 24px
    );

    border:5px solid #54280c;
    border-radius:4px;

    z-index:10;
}

/* JUMP BUTTON */
#jump{
    position:absolute;
    right:25px;
    bottom:120px;

    width:145px;
    height:68px;

    border:0;
    border-radius:35px;

    background:#e53935;
    color:white;

    font-size:22px;
    font-weight:bold;

    z-index:100;

    box-shadow:0 6px 0 #a71916;
}

#jump:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #a71916;
}

/* GAME OVER */
#gameOver{
    position:absolute;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:rgba(0,0,0,.72);

    color:white;

    z-index:200;
}

#gameOver h1{
    font-size:44px;
    margin-bottom:12px;
}

#finalScore{
    font-size:23px;
}

#restart{
    margin-top:22px;

    padding:14px 35px;

    border:0;
    border-radius:30px;

    background:#2196f3;
    color:white;

    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="sun"></div>

    <div id="score">
        Score: 0
    </div>

    <div id="dog">
        🐕
    </div>

    <div id="ground"></div>

    <button id="jump">
        JUMP 🦘
    </button>

    <div id="gameOver">

        <h1>GAME OVER 💥</h1>

        <div id="finalScore">
            Score: 0
        </div>

        <button id="restart">
            RESTART 🔄
        </button>

    </div>

</div>


<script>

/* ==============================
   ELEMENTS
============================== */

const dog =
    document.getElementById("dog");

const game =
    document.getElementById("game");

const jumpButton =
    document.getElementById("jump");

const scoreText =
    document.getElementById("score");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const restart =
    document.getElementById("restart");


/* ==============================
   VARIABLES
============================== */

let playing = true;

let dogY = 0;

let velocity = 0;

let jumping = false;


/* PHYSICS */

const gravity = 0.72;

const jumpPower = 11;


/* GAME */

let speed = 5;

let score = 0;

let walls = [];


/*
   Timer ديال السور
*/

let spawnTimer = 0;


/*
   الوقت العشوائي بين الأسوار
*/

let nextWallTime =
    randomBetween(120,180);


/* ==============================
   RANDOM NUMBER
============================== */

function randomBetween(min,max){

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* ==============================
   JUMP
============================== */

function jump(){

    if(!playing)
        return;

    /*
       ما يمكنش تقفز
       وانت باقي فالهواء
    */

    if(jumping)
        return;

    jumping = true;

    velocity = jumpPower;

}


/* MOBILE */

jumpButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        jump();

    },
    {passive:false}
);


/* CLICK */

jumpButton.addEventListener(
    "click",
    jump
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();

        }

    }
);


/* ==============================
   CREATE WALL
============================== */

function createWall(){

    const wall =
        document.createElement("div");

    wall.className = "wall";

    wall.style.right =
        "-80px";

    game.appendChild(wall);

    walls.push({

        element:wall,

        passed:false

    });

}


/* ==============================
   COLLISION
============================== */

function checkCollision(){

    const dogBox =
        dog.getBoundingClientRect();


    /*
       نصغرو hitbox ديال الكلب
       باش الاصطدام يكون عادل
    */

    const dogLeft =
        dogBox.left + 18;

    const dogRight =
        dogBox.right - 18;

    const dogTop =
        dogBox.top + 12;

    const dogBottom =
        dogBox.bottom - 7;


    for(const wall of walls){

        const wallBox =
            wall.element.getBoundingClientRect();


        /*
           إذا كان السور بعيد
           على الكلب، ما نفحصوهش
        */

        if(
            wallBox.left >
            dogRight + 5
        ){

            continue;

        }


        /*
           إذا السور داز من الكلب
        */

        if(
            wallBox.right <
            dogLeft
        ){

            continue;

        }


        /*
           الاصطدام الحقيقي
        */

        const horizontal =
            dogRight >
            wallBox.left &&
            dogLeft <
            wallBox.right;


        const vertical =
            dogBottom >
            wallBox.top &&
            dogTop <
            wallBox.bottom;


        if(
            horizontal &&
            vertical
        ){

            return true;

        }

    }


    return false;

}


/* ==============================
   GAME OVER
============================== */

function endGame(){

    playing = false;

    finalScore.textContent =
        "Score: " +
        Math.floor(score);

    gameOverScreen.style.display =
        "flex";

}


/* ==============================
   GAME LOOP
============================== */

function update(){

    if(!playing)
        return;


    /* ==========================
       DOG PHYSICS
    ========================== */

    if(jumping){

        dogY += velocity;

        velocity -= gravity;


        /*
           ملي يوصل للأرض
        */

        if(dogY <= 0){

            dogY = 0;

            velocity = 0;

            jumping = false;

        }

    }


    dog.style.bottom =
        (95 + dogY) + "px";


    /* ==========================
       SPAWN WALL
    ========================== */

    spawnTimer++;


    if(
        spawnTimer >=
        nextWallTime
    ){

        createWall();

        spawnTimer = 0;


        /*
           مسافة عشوائية
           بين الأسوار
        */

        nextWallTime =
            randomBetween(120,180);

    }


    /* ==========================
       MOVE WALLS
    ========================== */

    for(
        let i = walls.length - 1;
        i >= 0;
        i--
    ){

        const wall =
            walls[i];

        const element =
            wall.element;


        let right =
            parseFloat(
                getComputedStyle(
                    element
                ).right
            );


        right += speed;


        element.style.right =
            right + "px";


        /* ======================
           COLLISION
        ====================== */

        if(checkCollision()){

            endGame();

            return;

        }


        /* ======================
           SCORE
        ====================== */

        const wallBox =
            element.getBoundingClientRect();

        const dogBox =
            dog.getBoundingClientRect();


        if(
            !wall.passed &&
            wallBox.right <
            dogBox.left
        ){

            wall.passed = true;

            score += 10;

        }


        /* ======================
           REMOVE WALL
        ====================== */

        if(
            right >
            window.innerWidth + 100
        ){

            element.remove();

            walls.splice(i,1);

        }

    }


    /* TIME SCORE */

    score += 0.02;

    scoreText.textContent =
        "Score: " +
        Math.floor(score);


    /* ==========================
       DIFFICULTY
    ========================== */

    speed += 0.00025;


    requestAnimationFrame(update);

}


/* ==============================
   RESTART
============================== */

restart.addEventListener(
    "click",
    function(){

        location.reload();

    }
);


/* ==============================
   START
============================== */

update();

</script>

</body>
    </html>
