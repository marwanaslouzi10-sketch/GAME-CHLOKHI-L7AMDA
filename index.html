<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dog Runner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(
        #55c8ff 0%,
        #c8f1ff 58%,
        #6bc653 58%,
        #35952f 100%
    );
}

/* MAPS */

#game.s2{
    background:linear-gradient(
        #92999d 0%,
        #cbd0d2 55%,
        #55595c 55%,
        #292b2e 100%
    );
}

#game.s3{
    background:linear-gradient(
        #16aef5 0%,
        #8de0ff 65%,
        #eafaff 100%
    );
}

#game.s4{
    background:linear-gradient(
        #ffae4f 0%,
        #e65c30 50%,
        #70251c 75%,
        #210707 100%
    );
}

#game.s5{
    background:linear-gradient(
        #11172c 0%,
        #222c4a 55%,
        #070910 100%
    );
}

#game.s6{
    background:linear-gradient(
        #060817 0%,
        #181d3a 55%,
        #030409 100%
    );
}

/* GROUND */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:18%;
    background:#399b32;
}

.s2 #ground{
    background:#36393b;
}

.s3 #ground{
    background:#dcecff;
}

.s4 #ground{
    background:#3b100b;
}

.s5 #ground,
.s6 #ground{
    background:#080a12;
}

/* SCORE */

#score{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:24px;
    font-weight:bold;
    z-index:100;
    text-shadow:2px 2px 4px #000;
}

#stage{
    position:absolute;
    top:48px;
    left:15px;
    color:white;
    font-size:18px;
    font-weight:bold;
    z-index:100;
    text-shadow:2px 2px 4px #000;
}

/* DOG */

#dog{
    position:absolute;
    left:10%;
    bottom:18%;
    width:70px;
    height:70px;
    font-size:48px;
    line-height:70px;
    text-align:center;
    z-index:20;
    transform-origin:center bottom;
}

/* BUTTONS */

.btn{
    position:absolute;
    right:25px;
    bottom:25px;
    width:125px;
    height:65px;
    border:0;
    border-radius:15px;
    color:white;
    font-size:21px;
    font-weight:bold;
    z-index:100;
    touch-action:none;
}

#jump{
    background:#2563eb;
}

#shoot{
    background:#dc2626;
    display:none;
}

#duck{
    background:#9333ea;
    display:none;
}

/* WOOD */

.wood{
    position:absolute;
    width:42px;
    height:65px;
    bottom:18%;
    background:#8b4513;
    border:4px solid #572b0b;
    border-radius:4px;
    z-index:10;
}

.wood:before{
    content:"";
    position:absolute;
    width:26px;
    height:5px;
    left:4px;
    top:12px;
    background:#c47b3c;
    transform:rotate(-10deg);
}

.wood:after{
    content:"";
    position:absolute;
    width:25px;
    height:5px;
    left:5px;
    top:36px;
    background:#c47b3c;
    transform:rotate(8deg);
}

.hp{
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 3px #000;
}

/* BULLET */

.bullet{
    position:absolute;
    width:17px;
    height:6px;
    background:#ffd000;
    border-radius:5px;
    z-index:30;
}

/* BIRD */

.bird{
    position:absolute;
    width:55px;
    height:45px;
    font-size:38px;
    z-index:15;
}

/* GAME OVER */

#over{
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    font-size:42px;
    font-weight:bold;
    text-shadow:3px 3px 7px #000;
    z-index:200;
    display:none;
    width:90%;
}
</style>
</head>

<body>

<div id="game">

    <div id="score">SCORE: 0</div>
    <div id="stage">STAGE 1 - DAY</div>

    <div id="over"></div>

    <div id="dog">🐕</div>

    <div id="ground"></div>

    <button id="jump" class="btn">JUMP</button>
    <button id="shoot" class="btn">SHOOT</button>
    <button id="duck" class="btn">DUCK</button>

</div>

<script>

/* ==============================
   GAME
============================== */

const game = document.getElementById("game");
const dog = document.getElementById("dog");
const scoreText = document.getElementById("score");
const stageText = document.getElementById("stage");
const over = document.getElementById("over");

const jumpButton = document.getElementById("jump");
const shootButton = document.getElementById("shoot");
const duckButton = document.getElementById("duck");

let score = 0;
let stage = 1;

let playing = true;
let gameOver = false;

let dogY = 0;
let velocity = 0;
let jumping = false;
let ducking = false;

let woods = [];
let bullets = [];
let birds = [];

let woodTimer = 0;
let birdTimer = 0;

let lastTime = performance.now();


/* ==============================
   STAGE
============================== */

function updateStage(){

    game.className = "";

    if(stage === 1){

        game.classList.add("stage1");

        stageText.textContent =
            "STAGE 1 - DAY";

        dog.textContent = "🐕";
    }

    else if(stage === 2){

        game.classList.add("s2");

        stageText.textContent =
            "STAGE 2 - MILITARY DAY";

        dog.textContent = "🪖🐕";
    }

    else if(stage === 3){

        game.classList.add("s3");

        stageText.textContent =
            "STAGE 3 - SKY DAY";

        dog.textContent = "🐕";
    }

    else if(stage === 4){

        game.classList.add("s4");

        stageText.textContent =
            "STAGE 4 - VOLCANO";

        dog.textContent = "🐕";
    }

    else if(stage === 5){

        game.classList.add("s5");

        stageText.textContent =
            "STAGE 5 - NIGHT";

        dog.textContent = "🐕";
    }

    else{

        game.classList.add("s6");

        stageText.textContent =
            "STAGE " + stage + " - DARK ZONE";

        dog.textContent = "🐕";
    }


    /* BUTTONS */

    jumpButton.style.display =
        (stage === 1 || stage >= 4)
        ? "block"
        : "none";

    shootButton.style.display =
        stage === 2
        ? "block"
        : "none";

    duckButton.style.display =
        stage === 3
        ? "block"
        : "none";
}


/* ==============================
   CLEAR OLD OBJECTS
============================== */

function clearObjects(){

    woods.forEach(w => w.remove());
    bullets.forEach(b => b.remove());
    birds.forEach(b => b.remove());

    woods = [];
    bullets = [];
    birds = [];
}


/* ==============================
   JUMP
============================== */

function jump(){

    if(!playing || gameOver)
        return;

    if(stage === 3)
        return;

    if(jumping)
        return;

    jumping = true;
    velocity = 13;
}

jumpButton.addEventListener("click", jump);

document.addEventListener("keydown", function(e){

    if(e.code === "Space" || e.code === "ArrowUp"){
        e.preventDefault();
        jump();
    }

    if(e.code === "ArrowDown" && stage === 3){
        ducking = true;
    }

    if(e.code === "KeyX"){
        shoot();
    }
});

document.addEventListener("keyup", function(e){

    if(e.code === "ArrowDown"){
        ducking = false;
    }
});


/* ==============================
   DUCK
============================== */

duckButton.addEventListener("pointerdown", function(e){

    e.preventDefault();

    if(stage === 3 && playing && !gameOver){
        ducking = true;
    }
});

duckButton.addEventListener("pointerup", function(e){

    e.preventDefault();
    ducking = false;
});

duckButton.addEventListener("pointercancel", function(){
    ducking = false;
});

duckButton.addEventListener("pointerleave", function(){
    ducking = false;
});


/* ==============================
   SHOOT
============================== */

function shoot(){

    if(
        !playing ||
        gameOver ||
        stage !== 2
    ){
        return;
    }

    const dogRect =
        dog.getBoundingClientRect();

    const gameRect =
        game.getBoundingClientRect();

    const bullet =
        document.createElement("div");

    bullet.className = "bullet";

    bullet.x =
        dogRect.right -
        gameRect.left;

    bullet.y =
        dogRect.top -
        gameRect.top +
        32;

    bullet.style.left =
        bullet.x + "px";

    bullet.style.top =
        bullet.y + "px";

    game.appendChild(bullet);

    bullets.push(bullet);
}

shootButton.addEventListener("click", shoot);


/* ==============================
   WOOD
============================== */

function createWood(){

    const wood =
        document.createElement("div");

    wood.className = "wood";

    wood.x =
        window.innerWidth + 30;

    wood.hp = 3;

    wood.style.left =
        wood.x + "px";

    if(stage === 2){

        const hp =
            document.createElement("div");

        hp.className = "hp";
        hp.textContent = "3";

        wood.appendChild(hp);

        wood.hpElement = hp;
    }

    game.appendChild(wood);

    woods.push(wood);
}


/* ==============================
   BIRD
============================== */

function createBird(){

    const bird =
        document.createElement("div");

    bird.className = "bird";
    bird.textContent = "🦅";

    bird.x =
        window.innerWidth + 60;

    bird.y =
        game.clientHeight * 0.82 - 105;

    bird.style.left =
        bird.x + "px";

    bird.style.top =
        bird.y + "px";

    game.appendChild(bird);

    birds.push(bird);
}


/* ==============================
   COLLISION
============================== */

function collision(a,b){

    return(
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}


/* ==============================
   GAME OVER
============================== */

function lose(){

    if(gameOver)
        return;

    gameOver = true;
    playing = false;

    over.style.display = "block";

    over.innerHTML =
        "GAME OVER<br>" +
        "<span style='font-size:22px'>" +
        "SCORE: " +
        Math.floor(score) +
        "<br><br>" +
        "TAP TO RESTART" +
        "</span>";
}


/* ==============================
   RESTART
============================== */

game.addEventListener("click", function(){

    if(gameOver){
        location.reload();
    }

});


/* ==============================
   SPEED
============================== */

function getSpeed(){

    if(stage <= 5){

        return 5 +
            (stage - 1) * 0.35;
    }

    return 6.4 +
        (stage - 5) * 0.5;
}


/* ==============================
   GAME LOOP
============================== */

function gameLoop(now){

    if(!playing)
        return;

    const dt =
        Math.min(
            (now - lastTime) / 16.67,
            2
        );

    lastTime = now;


    /* PLAYER */

    if(stage === 3){

        dogY = 0;
        velocity = 0;
        jumping = false;

    }

    else if(jumping){

        velocity -= 0.75 * dt;

        dogY += velocity * dt;

        if(dogY <= 0){

            dogY = 0;
            velocity = 0;
            jumping = false;
        }
    }


    /* DOG MOVEMENT */

    if(stage === 3 && ducking){

        dog.style.transform =
            "translateY(24px) scaleY(.6)";

    }
    else{

        dog.style.transform =
            "translateY(" +
            (-dogY) +
            "px)";
    }


    /* SCORE */

    score += 0.025 * dt;

    scoreText.textContent =
        "SCORE: " +
        Math.floor(score);


    /* STAGE CHECK */

    const newStage =
        Math.floor(score / 50) + 1;

    if(newStage !== stage){

        stage = newStage;

        clearObjects();

        woodTimer = 0;
        birdTimer = 0;

        dogY = 0;
        velocity = 0;
        jumping = false;
        ducking = false;

        updateStage();
    }


    /* ==========================
       WOODS
    ========================== */

    if(stage !== 3){

        woodTimer += dt;

        const spawnTime =
            stage <= 5
            ? 110
            : Math.max(
                55,
                110 - (stage - 5) * 3
            );

        if(woodTimer >= spawnTime){

            woodTimer = 0;

            createWood();
        }


        const speed =
            getSpeed();


        const dogRect =
            dog.getBoundingClientRect();

        const gameRect =
            game.getBoundingClientRect();


        /* SMALL FEET HITBOX */

        const playerBox = {

            left:
                dogRect.left -
                gameRect.left +
                22,

            right:
                dogRect.right -
                gameRect.left -
                22,

            top:
                dogRect.bottom -
                gameRect.top -
                28,

            bottom:
                dogRect.bottom -
                gameRect.top -
                3
        };


        for(
            let i = woods.length - 1;
            i >= 0;
            i--
        ){

            const wood =
                woods[i];

            wood.x -=
                speed * dt;

            wood.style.left =
                wood.x + "px";


            const woodBox = {

                left:
                    wood.x + 5,

                right:
                    wood.x + 37,

                top:
                    game.clientHeight * 0.82 - 65,

                bottom:
                    game.clientHeight * 0.82
            };


            if(
                collision(
                    playerBox,
                    woodBox
                )
            ){

                lose();
                return;
            }


            if(wood.x < -80){

                wood.remove();

                woods.splice(i,1);

                score += 5;
            }
        }
    }


    /* ==========================
       BULLETS
    ========================== */

    for(
        let i = bullets.length - 1;
        i >= 0;
        i--
    ){

        const bullet =
            bullets[i];

        bullet.x +=
            12 * dt;

        bullet.style.left =
            bullet.x + "px";


        let destroyed =
            false;


        for(
            let j = woods.length - 1;
            j >= 0;
            j--
        ){

            const wood =
                woods[j];


            if(
                bullet.x + 17 > wood.x &&
                bullet.x < wood.x + 42
            ){

                wood.hp--;

                if(wood.hpElement){

                    wood.hpElement.textContent =
                        wood.hp;
                }

                bullet.remove();

                bullets.splice(i,1);

                destroyed = true;


                if(wood.hp <= 0){

                    wood.remove();

                    woods.splice(j,1);

                    score += 3;
                }

                break;
            }
        }


        if(!destroyed && bullet.x > window.innerWidth + 50){

            bullet.remove();

            bullets.splice(i,1);
        }
    }


    /* ==========================
       BIRDS
    ========================== */

    if(stage === 3){

        birdTimer += dt;

        if(birdTimer >= 90){

            birdTimer = 0;

            createBird();
        }


        const dogRect =
            dog.getBoundingClientRect();

        const gameRect =
            game.getBoundingClientRect();


        let head;


        if(ducking){

            head = {

                left:
                    dogRect.left -
                    gameRect.left +
                    25,

                right:
                    dogRect.right -
                    gameRect.left -
                    25,

                top:
                    dogRect.top -
                    gameRect.top +
                    36,

                bottom:
                    dogRect.top -
                    gameRect.top +
                    58
            };

        }

        else{

            head = {

                left:
                    dogRect.left -
                    gameRect.left +
                    18,

                right:
                    dogRect.right -
                    gameRect.left -
                    18,

                top:
                    dogRect.top -
                    gameRect.top +
                    10,

                bottom:
                    dogRect.top -
                    gameRect.top +
                    38
            };
        }


        for(
            let i = birds.length - 1;
            i >= 0;
            i--
        ){

            const bird =
                birds[i];

            bird.x -=
                6 * dt;

            bird.style.left =
                bird.x + "px";


            const birdBox = {

                left:
                    bird.x + 10,

                right:
                    bird.x + 43,

                top:
                    bird.y + 10,

                bottom:
                    bird.y + 34
            };


            if(
                collision(
                    head,
                    birdBox
                )
            ){

                lose();
                return;
            }


            if(bird.x < -80){

                bird.remove();

                birds.splice(i,1);

                score += 5;
            }
        }
    }


    requestAnimationFrame(gameLoop);
}


/* ==============================
   START GAME IMMEDIATELY
============================== */

updateStage();

requestAnimationFrame(function(time){

    lastTime = time;

    gameLoop(time);

});

</script>

</body>
    </html>
