<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* MAPS */

.stage1{
    background:linear-gradient(
        #55c6ff 0%,
        #c9f0ff 58%,
        #71c653 58%,
        #369532 100%
    );
}

.stage2{
    background:linear-gradient(
        #899398 0%,
        #c9cdcf 55%,
        #606568 55%,
        #303336 100%
    );
}

.stage3{
    background:linear-gradient(
        #20adf5 0%,
        #8cdeff 65%,
        #e5f8ff 100%
    );
}

.stage4{
    background:linear-gradient(
        #ffae50 0%,
        #e65d32 50%,
        #70241d 75%,
        #250909 100%
    );
}

.stage5{
    background:linear-gradient(
        #11172b 0%,
        #202945 55%,
        #080a11 100%
    );
}

.stage6{
    background:linear-gradient(
        #070918 0%,
        #181c38 55%,
        #030409 100%
    );
}

/* GROUND */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:18%;
    background:#399c32;
    z-index:5;
}

.stage2 #ground{
    background:#34383b;
}

.stage3 #ground{
    background:rgba(255,255,255,.3);
}

.stage4 #ground{
    background:#301010;
}

.stage5 #ground,
.stage6 #ground{
    background:#08090e;
}

/* SCORE */

#score{
    position:absolute;
    top:14px;
    left:15px;
    z-index:100;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}

#stageText{
    position:absolute;
    top:47px;
    left:15px;
    z-index:100;
    color:white;
    font-size:19px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}

/* STAGE MESSAGE */

#message{
    position:absolute;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:200;
    color:white;
    font-size:43px;
    font-weight:bold;
    text-align:center;
    text-shadow:3px 3px 7px #000;
    pointer-events:none;
    display:none;
}

/* PLAYER */

#player{
    position:absolute;
    left:11%;
    bottom:18%;
    width:70px;
    height:70px;
    z-index:20;
    font-size:52px;
    line-height:70px;
    text-align:center;
    transform:translateY(0);
}

#player.duck{
    transform:
        translateY(24px)
        scaleY(.60);
}

/* BUTTONS */

.control{
    position:absolute;
    right:25px;
    bottom:25px;
    width:125px;
    height:65px;
    z-index:150;
    border:none;
    border-radius:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 5px 0 rgba(0,0,0,.35);
    touch-action:none;
}

#jumpButton{
    background:#2563eb;
}

#shootButton{
    background:#dc2626;
    display:none;
}

#duckButton{
    background:#9333ea;
    display:none;
}

.control:active{
    transform:translateY(4px);
}

/* WOOD */

.obstacle{
    position:absolute;
    width:42px;
    height:65px;
    bottom:18%;
    background:#8b4513;
    border:4px solid #5b2c0c;
    border-radius:4px;
    z-index:10;
}

.obstacle::before{
    content:"";
    position:absolute;
    left:4px;
    top:12px;
    width:26px;
    height:5px;
    background:#c27a3c;
    transform:rotate(-10deg);
}

.obstacle::after{
    content:"";
    position:absolute;
    left:5px;
    top:35px;
    width:25px;
    height:5px;
    background:#c27a3c;
    transform:rotate(8deg);
}

.hpText{
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 3px #000;
}

/* BULLET */

.bullet{
    position:absolute;
    width:16px;
    height:6px;
    background:#ffd000;
    border-radius:5px;
    z-index:30;
}

/* BIRD */

.bird{
    position:absolute;
    width:55px;
    height:45px;
    font-size:42px;
    z-index:15;
}

</style>
</head>

<body>

<div id="game" class="stage1">

    <div id="score">
        SCORE: 0
    </div>

    <div id="stageText">
        STAGE 1 - DAY
    </div>

    <div id="message"></div>

    <div id="player">
        🐕
    </div>

    <div id="ground"></div>

    <button id="jumpButton" class="control">
        JUMP
    </button>

    <button id="shootButton" class="control">
        SHOOT
    </button>

    <button id="duckButton" class="control">
        DUCK
    </button>

</div>

<script>

/* ================= ELEMENTS ================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const stageText =
    document.getElementById("stageText");

const message =
    document.getElementById("message");

const jumpButton =
    document.getElementById("jumpButton");

const shootButton =
    document.getElementById("shootButton");

const duckButton =
    document.getElementById("duckButton");


/* ================= VARIABLES ================= */

let gameStarted = false;
let gameOver = false;

let score = 0;
let stage = 1;

let playerY = 0;
let velocityY = 0;

const gravity = 0.75;
const jumpPower = 13;

let jumping = false;
let ducking = false;

let obstacles = [];
let bullets = [];
let birds = [];

let obstacleTimer = 0;
let birdTimer = 0;

let lastTime = 0;


/* ================= START ================= */

function startGame(){

    if(gameStarted)
        return;

    gameStarted = true;
    gameOver = false;

    score = 0;
    stage = 1;

    playerY = 0;
    velocityY = 0;

    jumping = false;
    ducking = false;

    obstacleTimer = 0;
    birdTimer = 0;

    clearObjects();

    player.textContent = "🐕";
    player.classList.remove("duck");
    player.style.transform = "translateY(0)";

    scoreText.textContent = "SCORE: 0";

    message.style.display = "none";

    updateStage();

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


/* ================= JUMP ================= */

function jump(){

    if(!gameStarted || gameOver)
        return;

    if(stage === 3)
        return;

    if(jumping)
        return;

    jumping = true;
    velocityY = jumpPower;
}

jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();
    }
);


/* ================= KEYBOARD ================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();
        }

        if(
            e.code === "ArrowDown" &&
            stage === 3
        ){

            startDuck(e);
        }

        if(e.code === "KeyX"){

            shoot();
        }
    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.code === "ArrowDown"){

            stopDuck(e);
        }
    }
);


/* ================= DUCK ================= */

function startDuck(e){

    if(e)
        e.preventDefault();

    if(
        !gameStarted ||
        gameOver ||
        stage !== 3
    )
        return;

    ducking = true;

    player.classList.add("duck");
}

function stopDuck(e){

    if(e)
        e.preventDefault();

    ducking = false;

    player.classList.remove("duck");
}


/* Phone DUCK */

duckButton.addEventListener(
    "pointerdown",
    startDuck
);

duckButton.addEventListener(
    "pointerup",
    stopDuck
);

duckButton.addEventListener(
    "pointercancel",
    stopDuck
);

duckButton.addEventListener(
    "pointerleave",
    stopDuck
);


/* ================= SHOOT ================= */

function shoot(){

    if(
        !gameStarted ||
        gameOver ||
        stage !== 2
    )
        return;

    const rect =
        player.getBoundingClientRect();

    const gameRect =
        game.getBoundingClientRect();

    const bullet =
        document.createElement("div");

    bullet.className = "bullet";

    bullet.x =
        rect.right -
        gameRect.left;

    bullet.y =
        rect.top -
        gameRect.top +
        30;

    bullet.style.left =
        bullet.x + "px";

    bullet.style.top =
        bullet.y + "px";

    game.appendChild(bullet);

    bullets.push(bullet);
}


shootButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        shoot();
    }
);


/* ================= OBSTACLE ================= */

function createObstacle(){

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "obstacle";

    obstacle.x =
        window.innerWidth + 30;

    obstacle.hp = 3;

    obstacle.style.left =
        obstacle.x + "px";


    if(stage === 2){

        const hp =
            document.createElement("div");

        hp.className =
            "hpText";

        hp.textContent = "3";

        obstacle.appendChild(hp);

        obstacle.hpText = hp;
    }


    game.appendChild(obstacle);

    obstacles.push(obstacle);
}


/* ================= BIRD ================= */

function createBird(){

    const bird =
        document.createElement("div");

    bird.className = "bird";

    bird.textContent = "🦅";

    bird.x =
        window.innerWidth + 60;

    /* Bird raised higher */

    bird.y =
        game.clientHeight * 0.82 - 105;

    bird.y +=
        Math.random() * 15 - 7;

    bird.style.left =
        bird.x + "px";

    bird.style.top =
        bird.y + "px";

    game.appendChild(bird);

    birds.push(bird);
}


/* ================= CLEAR ================= */

function clearObjects(){

    obstacles.forEach(
        o => o.remove()
    );

    bullets.forEach(
        b => b.remove()
    );

    birds.forEach(
        b => b.remove()
    );

    obstacles = [];
    bullets = [];
    birds = [];
}


/* ================= STAGE ================= */

function updateStage(){

    updateMap();
    updateControls();


    if(stage === 1){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 1 - DAY";
    }

    else if(stage === 2){

        player.textContent =
            "🪖🐕";

        stageText.textContent =
            "STAGE 2 - MILITARY DAY";
    }

    else if(stage === 3){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 3 - SKY DAY";
    }

    else if(stage === 4){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 4 - VOLCANO";
    }

    else if(stage === 5){

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE 5 - NIGHT";
    }

    else{

        player.textContent = "🐕";

        stageText.textContent =
            "STAGE " +
            stage +
            " - DARK ZONE";
    }
}


/* ================= MAP ================= */

function updateMap(){

    game.className = "";

    if(stage === 1)
        game.classList.add("stage1");

    else if(stage === 2)
        game.classList.add("stage2");

    else if(stage === 3)
        game.classList.add("stage3");

    else if(stage === 4)
        game.classList.add("stage4");

    else if(stage === 5)
        game.classList.add("stage5");

    else
        game.classList.add("stage6");
}


/* ================= CONTROLS ================= */

function updateControls(){

    jumpButton.style.display =
        (
            stage === 1 ||
            stage >= 4
        )
        ? "block"
        : "none";

    shootButton.style.display =
        stage === 2
        ? "block"
        : "none";

    duckButton.style.display =
        stage === 3
        ? "block"
        : "none";
}


/* ================= PLAYER BOX ================= */

function getPlayerBox(){

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        player.getBoundingClientRect();


    /* STAGE 3 = HEAD */

    if(stage === 3){

        if(ducking){

            return {

                left:
                    rect.left -
                    gameRect.left + 25,

                right:
                    rect.right -
                    gameRect.left - 25,

                top:
                    rect.top -
                    gameRect.top + 36,

                bottom:
                    rect.top -
                    gameRect.top + 58
            };
        }


        return {

            left:
                rect.left -
                gameRect.left + 18,

            right:
                rect.right -
                gameRect.left - 18,

            top:
                rect.top -
                gameRect.top + 10,

            bottom:
                rect.top -
                gameRect.top + 38
        };
    }


    /* OTHER STAGES = FEET */

    return {

        left:
            rect.left -
            gameRect.left + 22,

        right:
            rect.right -
            gameRect.left - 22,

        top:
            rect.bottom -
            gameRect.top - 28,

        bottom:
            rect.bottom -
            gameRect.top - 3
    };
}


/* ================= COLLISION ================= */

function collision(a,b){

    return(
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}


/* ================= OBSTACLE BOX ================= */

function getObstacleBox(o){

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        o.getBoundingClientRect();

    return {

        left:
            rect.left -
            gameRect.left + 5,

        right:
            rect.right -
            gameRect.left - 5,

        top:
            rect.top -
            gameRect.top + 3,

        bottom:
            rect.bottom -
            gameRect.top - 3
    };
}


/* ================= BIRD BOX ================= */

function getBirdBox(b){

    return {

        left: b.x + 10,
        right: b.x + 43,
        top: b.y + 10,
        bottom: b.y + 34
    };
}


/* ================= SPEED ================= */

function getGameSpeed(){

    if(stage <= 5){

        return 5 +
            (stage - 1) * 0.35;
    }

    return 6.4 +
        (stage - 5) * 0.5;
}


/* ================= LOOP ================= */

function gameLoop(time){

    if(
        !gameStarted ||
        gameOver
    )
        return;


    const delta =
        Math.min(
            (time - lastTime) /
            16.67,
            2
        );

    lastTime = time;


    updatePlayer(delta);

    updateScore(delta);

    updateStageIfNeeded();

    updateObstacles(delta);

    updateBullets(delta);

    updateBirds(delta);


    requestAnimationFrame(
        gameLoop
    );
}


/* ================= PLAYER ================= */

function updatePlayer(delta){

    if(stage === 3){

        playerY = 0;
        velocityY = 0;
        jumping = false;

    }else if(jumping){

        velocityY -=
            gravity * delta;

        playerY +=
            velocityY * delta;


        if(playerY <= 0){

            playerY = 0;
            velocityY = 0;
            jumping = false;
        }
    }


    if(
        ducking &&
        stage === 3
    ){

        player.style.transform =
            "translateY(24px) scaleY(.60)";

    }else{

        player.style.transform =
            `translateY(${-playerY}px)`;
    }
}


/* ================= SCORE ================= */

function updateScore(delta){

    score +=
        0.025 * delta;

    scoreText.textContent =
        "SCORE: " +
        Math.floor(score);
}


/* ================= STAGE CHANGE ================= */

function updateStageIfNeeded(){

    const newStage =
        Math.floor(score / 50) + 1;


    if(newStage !== stage){

        stage = newStage;

        clearObjects();

        obstacleTimer = 0;
        birdTimer = 0;

        playerY = 0;
        velocityY = 0;

        jumping = false;
        ducking = false;

        player.classList.remove("duck");

        player.style.transform =
            "translateY(0)";

        updateStage();

        showStageMessage();
    }
}


/* ================= STAGE MESSAGE ================= */

function showStageMessage(){

    message.style.display =
        "block";

    message.textContent =
        "STAGE " + stage;


    setTimeout(
        function(){

            if(!gameOver){

                message.style.display =
                    "none";
            }

        },
        1200
    );
}


/* ================= OBSTACLES ================= */

function updateObstacles(delta){

    if(stage === 3)
        return;


    obstacleTimer += delta;


    let spawnTime;


    if(stage <= 5){

        spawnTime =
            stage === 1
            ? 100
            : 115;

    }else{

        spawnTime =
            Math.max(
                55,
                115 -
                (stage - 5) * 3
            );
    }


    if(obstacleTimer >= spawnTime){

        obstacleTimer = 0;

        createObstacle();
    }


    const speed =
        getGameSpeed();

    const playerBox =
        getPlayerBox();


    for(
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ){

        const o =
            obstacles[i];

        o.x -=
            speed * delta;

        o.style.left =
            o.x + "px";


        const obstacleBox =
            getObstacleBox(o);


        if(
            collision(
                playerBox,
                obstacleBox
            )
        ){

            endGame();

            return;
        }


        if(o.x < -80){

            o.remove();

            obstacles.splice(i,1);

            score += 5;
        }
    }
}


/* ================= BULLETS ================= */

function updateBullets(delta){

    for(
        let i = bullets.length - 1;
        i >= 0;
        i--
    ){

        const b =
            bullets[i];

        b.x +=
            12 * delta;

        b.style.left =
            b.x + "px";


        let hit = false;


        for(
            let j = obstacles.length - 1;
            j >= 0;
            j--
        ){

            const o =
                obstacles[j];


            if(
                b.x + 16 > o.x &&
                b.x < o.x + 42
            ){

                o.hp--;


                if(o.hpText){

                    o.hpText.textContent =
                        o.hp;
                }


                b.remove();

                bullets.splice(i,1);

                hit = true;


                if(o.hp <= 0){

                    o.remove();

                    obstacles.splice(j,1);

                    score += 3;
                }

                break;
            }
        }


        if(hit)
            continue;


        if(
            b.x >
            window.innerWidth
        ){

            b.remove();

            bullets.splice(i,1);
        }
    }
}


/* ================= BIRDS ================= */

function updateBirds(delta){

    if(stage !== 3)
        return;


    birdTimer += delta;


    if(birdTimer >= 90){

        birdTimer = 0;

        createBird();
    }


    const birdSpeed =
        stage <= 5
        ? 6
        : 6 +
          (stage - 5) * 0.5;


    const playerBox =
        getPlayerBox();


    for(
        let i = birds.length - 1;
        i >= 0;
        i--
    ){

        const b =
            birds[i];

        b.x -=
            birdSpeed * delta;

        b.style.left =
            b.x + "px";


        const birdBox =
            getBirdBox(b);


        if(
            collision(
                playerBox,
                birdBox
            )
        ){

            endGame();

            return;
        }


        if(b.x < -80){

            b.remove();

            birds.splice(i,1);

            score += 5;
        }
    }
}


/* ================= GAME OVER ================= */

function endGame(){

    if(gameOver)
        return;

    gameOver = true;

    message.styl
